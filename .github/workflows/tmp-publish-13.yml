# TEMPORARY (issue #13 pre-merge verification only; removed before the PR is marked ready).
name: tmp-publish-13
on:
  push:
    branches: [issue-13-cd-dev]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: cp .env.example .env
      - run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export IMAGE_PREFIX="ghcr.io/${owner}/fitwise"
          docker buildx bake -f compose.yaml --push --provenance=false --sbom=false \
            --metadata-file "$RUNNER_TEMP/bake-meta.json" \
            --set "*.labels.org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --set "*.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
            --set backend.cache-from=type=gha,scope=backend \
            --set frontend.cache-from=type=gha,scope=frontend \
            backend frontend
          be="$(jq -er '.backend["containerimage.digest"]' "$RUNNER_TEMP/bake-meta.json")"
          fe="$(jq -er '.frontend["containerimage.digest"]' "$RUNNER_TEMP/bake-meta.json")"
          echo "DIGESTS ${GITHUB_SHA} ghcr.io/${owner}/fitwise-backend@${be} ghcr.io/${owner}/fitwise-frontend@${fe}"
