# Pull-request pipeline (spec §13, §6.4, §10; issue #11).
# Every job calls the same make target a developer runs locally, so CI and laptops cannot drift.
# Branch protection on `main` requires the single aggregate check "CI passed" (job `ci-passed`),
# so jobs can be added or renamed here without touching the protection rule.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR / branch; a new push cancels the outdated run (never on main).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_VERSION: "0.12.9"

jobs:
  backend-lint:
    name: Backend lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make lint-backend

  backend-test:
    name: Backend tests (pytest, Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Not a secret: ephemeral service container, no real data (same as compose db-test).
          POSTGRES_DB: postgres
          POSTGRES_USER: fitwise_test
          POSTGRES_PASSWORD: fitwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -U fitwise_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # Set -> `make test-backend` uses this database instead of starting the compose db-test.
      TEST_DATABASE_URL: postgresql+psycopg://fitwise_test:fitwise_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make test-backend

  frontend:
    name: Frontend (eslint, tsc, client drift, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # lint-frontend = eslint + tsc --noEmit + `npm run check:api` (generated client up to date).
      - run: make lint-frontend
      - run: make test-frontend

  openapi-lint:
    name: OpenAPI lint (Redocly)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - run: make lint-openapi

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false
      - run: make scan-secrets

  dependency-scan:
    name: Dependency scan (pip-audit, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make scan-deps

  images:
    name: Images (build, Trivy scan, contract smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Images are tagged with the commit SHA, as in CD (#13). Built and loaded locally, never pushed.
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # only uvx schemathesis runs here
      - name: Create .env from .env.example (local placeholders only)
        run: cp .env.example .env
      - name: Build both images from compose.yaml (no push)
        run: |
          docker buildx bake -f compose.yaml --pull --load \
            --set backend.cache-from=type=gha,scope=backend \
            --set backend.cache-to=type=gha,scope=backend,mode=max \
            --set frontend.cache-from=type=gha,scope=frontend \
            --set frontend.cache-to=type=gha,scope=frontend,mode=max \
            backend frontend
      - name: Image vulnerability scan (Trivy, HIGH/CRITICAL with a fix)
        run: make scan-images
      - name: Start the stack
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Contract smoke (schemathesis vs openapi.yaml)
        run: make contract-smoke
      - name: Log privacy smoke
        run: make check-log-privacy
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  e2e:
    name: End-to-end (Playwright smoke, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TAG: ${{ github.sha }}
      # Official Playwright image, same version as e2e/package-lock.json (@playwright/test 1.63.0),
      # pinned by index digest like the other tool images in the Makefile.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create .env from .env.example (local placeholders only)
        run: cp .env.example .env
      # Same build as the images job; the shared GHA cache scopes make this mostly cache hits.
      - name: Build both images from compose.yaml (no push)
        run: |
          docker buildx bake -f compose.yaml --pull --load \
            --set backend.cache-from=type=gha,scope=backend \
            --set frontend.cache-from=type=gha,scope=frontend \
            backend frontend
      - name: Start the stack
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Playwright smoke test (official container, Chromium)
        # Host network: the stack is published on 127.0.0.1:HTTP_PORT (default 8088).
        run: |
          docker run --rm --network host --ipc=host -v "$PWD/e2e:/e2e" -w /e2e \
            -e CI=true -e E2E_BASE_URL=http://127.0.0.1:8088 \
            "$PLAYWRIGHT_IMAGE" sh -c 'npm ci --no-audit --no-fund && npx playwright test'
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Rollback guard (#82; spec §13, D50, ADR 0009): the previous release's backend image must start
  # on the schema this change migrates to, the way a rollback starts it (no migration step).
  # The previous release is HEAD^1: the PR's base for the pull_request merge commit, the previous
  # main commit on push. Runs when migrations, the backend image or compose files change; other
  # changes cannot break it, so the job then succeeds without building anything.
  rollback-compat:
    name: Rollback compatibility (previous image on the new schema)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD^1 = the previous release
          persist-credentials: false
      - name: Does this change touch the schema or the backend start path?
        id: changes
        run: |
          if git diff --quiet HEAD^1 HEAD -- \
              backend/alembic backend/alembic.ini backend/Dockerfile backend/pyproject.toml \
              backend/uv.lock backend/app/migrate.py backend/app/migrations.py backend/app/seed.py \
              backend/app/config.py backend/app/main.py 'compose*.yaml' \
              scripts/rollback-compat.sh .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No migration, image or compose change: rollback guard not needed."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Previous image on the new schema, started the rollback way
        if: steps.changes.outputs.run == 'true'
        run: make rollback-compat PREV_REF=HEAD^1

  hook-tests:
    name: Agent hook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scope-guard hook tests (ADR 0008, #60). Skipped until scripts/test-hooks.sh lands on main.
      - run: |
          if [ -f scripts/test-hooks.sh ]; then
            bash scripts/test-hooks.sh
          else
            echo "scripts/test-hooks.sh not present yet (#60); nothing to run."
          fi

  deploy-script-tests:
    name: Deploy script tests (promotion check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test-promote-verify.sh
      - run: bash scripts/test-deploy-demo-flag.sh
      - run: bash scripts/test-move-deploy-ref.sh
      - run: bash scripts/test-rollback-plan.sh
      - run: bash scripts/test-oncall-rollback.sh
      - run: bash scripts/test-obs-mode.sh

  oncall:
    name: On-call responder (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: oncall/uv.lock
      - run: make lint-oncall
      - run: make test-oncall

  ci-passed:
    name: CI passed
    if: always()
    needs:
      - backend-lint
      - backend-test
      - frontend
      - openapi-lint
      - secret-scan
      - dependency-scan
      - images
      - e2e
      - rollback-compat
      - hook-tests
      - deploy-script-tests
      - oncall
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::a required CI job did not succeed ($r)"; exit 1; fi
          done

  # ------------------------------------------------------------------------------------------
  # CD to dev (#13; spec §12, §13; ADR 0010, D57). Only on a push to main (= a merged PR).
  #   publish    builds both images ONCE for this commit and pushes them to GHCR as :<sha>,
  #              recording the digests (these are what hosts deploy, by digest).
  #   deploy-dev after CI passed, records the approved release by moving the ref `deploy/dev`
  #              (job in the `dev` environment; the built-in GITHUB_TOKEN, `contents: write` on
  #              this job only). The dev host polls that ref (deploy/poll.sh) and deploys.
  #   smoke-dev  waits until dev serves this SHA (GET /api/v1/healthz `version`), then runs the
  #              e2e smoke test against it. No AWS credentials anywhere.
  # Target: merged -> deployed on dev within 10 minutes.
  # These jobs are not part of `ci-passed`: they only exist on main, after the PR gate.
  # ------------------------------------------------------------------------------------------
  publish:
    name: Publish images (GHCR, by SHA)
    needs: [ci-passed] # untested images never reach GHCR or dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-passed.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.digests.outputs.backend_image }}
      frontend_image: ${{ steps.digests.outputs.frontend_image }}
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Create .env from .env.example (compose interpolation only; nothing is baked into images)
        run: cp .env.example .env
      - name: Build and push both images tagged with the commit SHA
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export IMAGE_PREFIX="ghcr.io/${owner}/fitwise"
          docker buildx bake -f compose.yaml --push --provenance=false --sbom=false \
            --metadata-file "$RUNNER_TEMP/bake-meta.json" \
            --set "*.labels.org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --set "*.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
            --set backend.cache-from=type=gha,scope=backend \
            --set frontend.cache-from=type=gha,scope=frontend \
            backend frontend
      - name: Record the image digests
        id: digests
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          be="$(jq -er '.backend["containerimage.digest"]' "$RUNNER_TEMP/bake-meta.json")"
          fe="$(jq -er '.frontend["containerimage.digest"]' "$RUNNER_TEMP/bake-meta.json")"
          echo "backend_image=ghcr.io/${owner}/fitwise-backend@${be}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/fitwise-frontend@${fe}" >> "$GITHUB_OUTPUT"
          {
            echo "### Images for ${GITHUB_SHA}"
            echo "- backend: \`ghcr.io/${owner}/fitwise-backend@${be}\`"
            echo "- frontend: \`ghcr.io/${owner}/fitwise-frontend@${fe}\`"
            echo "- pushed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
          # The promotion workflow (#14) reads these exact digests, so prod runs what dev ran.
          printf 'backend: ghcr.io/%s/fitwise-backend@%s\nfrontend: ghcr.io/%s/fitwise-frontend@%s\n' \
            "$owner" "$be" "$owner" "$fe" > "$RUNNER_TEMP/release-record.txt"
      - name: Keep the release record for the promotion workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: ${{ runner.temp }}/release-record.txt
          retention-days: 90

  deploy-dev:
    name: Approve release for dev (move deploy/dev)
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: write # moves the deploy/dev ref; this job only. A ruleset on deploy/* lets only GitHub Actions do it.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
    steps:
      - name: Skip when a newer commit is already on main
        id: fresh
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main moved to $head; $GITHUB_SHA is superseded and will not be deployed."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fresh.outputs.current == 'true'
        with:
          persist-credentials: false
      - name: Move deploy/dev to this release
        if: steps.fresh.outputs.current == 'true'
        run: |
          # Deploy commit = release record (message) on the tree of the current deploy/dev commit,
          # so it never changes .github/workflows (GITHUB_TOKEN would get a 403). The host reads only
          # the message. See scripts/move-deploy-ref.sh.
          new="$(scripts/move-deploy-ref.sh dev "$GITHUB_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE")"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "deploy/dev -> ${new} (release ${GITHUB_SHA}) at ${now}"
          {
            echo "### Dev release approved"
            echo "- release: \`${GITHUB_SHA}\`"
            echo "- ref deploy/dev moved at ${now} (merge commit time: ${{ github.event.head_commit.timestamp }})"
            echo "- backend: \`${BACKEND_IMAGE}\`"
            echo "- frontend: \`${FRONTEND_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-dev:
    name: Dev serves this SHA, then e2e smoke
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-dev.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: dev
    permissions:
      contents: read
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until dev serves this SHA (up to 12 minutes)
        run: |
          : "${DEV_BASE_URL:?set the DEV_BASE_URL variable in the dev environment}"
          deadline=$((SECONDS + 720))
          while [ "$SECONDS" -lt "$deadline" ]; do
            v="$(curl -fsS --max-time 5 "$DEV_BASE_URL/api/v1/healthz" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
            echo "$(date -u +%H:%M:%SZ) dev serves: ${v:-unreachable}"
            if [ "$v" = "$GITHUB_SHA" ]; then
              echo "dev serves $GITHUB_SHA at $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::dev did not serve $GITHUB_SHA within 12 minutes (the host may have rolled back; see deploy/README.md)"
          exit 1
      - name: Playwright smoke test against dev
        run: |
          docker run --rm --network host --ipc=host -v "$PWD/e2e:/e2e" -w /e2e \
            -e CI=true -e E2E_BASE_URL="$DEV_BASE_URL" \
            "$PLAYWRIGHT_IMAGE" sh -c 'npm ci --no-audit --no-fund && npx playwright test'
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-dev
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
