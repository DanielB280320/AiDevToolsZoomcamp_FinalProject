# Tempo, single binary, blocks on local disk under /var/tempo (a volume). Traces arrive from the
# collector over OTLP/gRPC. Started with -config.expand-env=true: ${TEMPO_RETENTION} is set in
# compose.observability.yaml (default 72h). Tempo 3.x applies retention in the backend
# scheduler/worker, so it is set on both.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: ${TEMPO_RETENTION:-72h}

backend_worker:
  compaction:
    block_retention: ${TEMPO_RETENTION:-72h}

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
