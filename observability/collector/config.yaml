# OpenTelemetry Collector (spec §14, ADR 0006). One collector per host; locally via `make up-obs`.
#
#   traces : backend OTLP/HTTP  -> allow-list span attributes -> Tempo   (OTLP/gRPC)
#   metrics: backend OTLP/HTTP  -> allow-list labels          -> Prometheus (OTLP receiver, exemplars)
#   logs   : backend JSON stdout -> Docker fluentd log driver -> fluent_forward -> parse,
#            allow-list fields -> Loki (OTLP)
#
# Privacy (CLAUDE.md rule 6, spec §6.5). The backend already filters everything it emits; this file
# is a second, independent gate. Every allow-list below MIRRORS backend/app/telemetry/privacy.py
# (LOG_BASE_FIELDS + LOG_EVENT_FIELDS, SPAN_ATTRIBUTES, METRIC_ATTRIBUTES, SENSITIVE_FIELD_NAMES).
# backend/tests/unit/test_collector_allow_lists.py fails when the two drift apart: when you add a
# name there, add it here too (and the other way round).
#
# `env`: kept when the sender sets it (resource attribute `env` from APP_ENV), inserted from
# FITWISE_ENV when it is missing. Prometheus and Loki index it as a label; Tempo keeps it as a
# resource attribute.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Backend stdout/stderr, shipped by Docker's `fluentd` logging driver, which only the backend
  # uses (compose.observability.yaml). No other container's logs ever reach the collector, and
  # it needs no host mounts. Each record's body is one line the backend wrote.
  fluent_forward:
    endpoint: 0.0.0.0:24224

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50

  # Logs: parse the JSON line and rebuild the record from allow-listed fields only. Base fields
  # map to the record itself (timestamp, level -> severity, message -> body, trace_id/span_id ->
  # trace context, env/service/version -> resource); event fields become attributes (Loki
  # structured metadata). The Docker fields (container_id, container_name, source) are dropped.
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(log.cache, ParseJSON(log.body), "upsert") where IsString(log.body) and IsMatch(log.body, "^\\s*\\{")
          - set(log.attributes["service.name"], log.cache["service"]) where IsString(log.cache["service"])
          - set(log.attributes["service.version"], log.cache["version"]) where IsString(log.cache["version"])
          - set(log.attributes["env"], log.cache["env"]) where IsString(log.cache["env"])
          - set(log.attributes["logger"], log.cache["logger"]) where IsString(log.cache["logger"])
          - set(log.time, Time(log.cache["timestamp"], "%Y-%m-%dT%H:%M:%S.%LZ")) where IsString(log.cache["timestamp"])
          - set(log.severity_text, log.cache["level"]) where IsString(log.cache["level"])
          - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.cache["level"] == "debug"
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.cache["level"] == "info"
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.cache["level"] == "warning"
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.cache["level"] == "error"
          - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.cache["level"] == "critical"
          - set(log.trace_id.string, log.cache["trace_id"]) where IsString(log.cache["trace_id"])
          - set(log.span_id.string, log.cache["span_id"]) where IsString(log.cache["span_id"])
          # --- LOG_EVENT_FIELDS (backend/app/telemetry/privacy.py) ---
          - set(log.attributes["route"], log.cache["route"]) where log.cache["route"] != nil
          - set(log.attributes["method"], log.cache["method"]) where log.cache["method"] != nil
          - set(log.attributes["status"], log.cache["status"]) where log.cache["status"] != nil
          - set(log.attributes["duration_ms"], log.cache["duration_ms"]) where log.cache["duration_ms"] != nil
          - set(log.attributes["user_hash"], log.cache["user_hash"]) where log.cache["user_hash"] != nil
          - set(log.attributes["error_type"], log.cache["error_type"]) where log.cache["error_type"] != nil
          - set(log.attributes["check"], log.cache["check"]) where log.cache["check"] != nil
          - set(log.attributes["outcome"], log.cache["outcome"]) where log.cache["outcome"] != nil
          - set(log.attributes["kind"], log.cache["kind"]) where log.cache["kind"] != nil
          - set(log.attributes["rule"], log.cache["rule"]) where log.cache["rule"] != nil
          - set(log.attributes["decision"], log.cache["decision"]) where log.cache["decision"] != nil
          - set(log.attributes["engine"], log.cache["engine"]) where log.cache["engine"] != nil
          - set(log.attributes["count"], log.cache["count"]) where log.cache["count"] != nil
          - set(log.attributes["flag_key"], log.cache["flag_key"]) where log.cache["flag_key"] != nil
          - set(log.attributes["flag_old_value"], log.cache["flag_old_value"]) where log.cache["flag_old_value"] != nil
          - set(log.attributes["flag_new_value"], log.cache["flag_new_value"]) where log.cache["flag_new_value"] != nil
          - set(log.attributes["actor"], log.cache["actor"]) where log.cache["actor"] != nil
          - set(log.attributes["revision"], log.cache["revision"]) where log.cache["revision"] != nil
          # Drop the Docker fields and anything not copied above.
          - keep_keys(log.attributes, ["service.name", "service.version", "env", "logger", "route", "method", "status", "duration_ms", "user_hash", "error_type", "check", "outcome", "kind", "rule", "decision", "engine", "count", "flag_key", "flag_old_value", "flag_new_value", "actor", "revision"])
          # The message only (a constant template written by the app logger); "" if absent.
          - set(log.body, "")
          - set(log.body, log.cache["message"]) where IsString(log.cache["message"])
          # Free-text guard mirroring scrub_text (backend/app/telemetry/privacy.py): mask emails and
          # tokens, then cap the length. Kept in sync by test_collector_allow_lists.py.
          - replace_pattern(log.body, "[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+", "[email]")
          - replace_pattern(log.body, "(?i)\\bbearer\\s+\\S+", "Bearer [token]")
          - replace_pattern(log.body, "\\beyJ[\\w-]+\\.[\\w-]+\\.[\\w-]+", "[token]")
          - set(log.body, Concat([Substring(log.body, 0, 256), "..."], "")) where Len(log.body) > 256

  # A line that is not a JSON object from the app logger (a traceback printed before logging is
  # configured, a stray print) never went through the allow-list: drop it.
  filter/unparsed_logs:
    error_mode: ignore
    logs:
      log_record:
        - log.attributes["service.name"] == nil

  # service.name / service.version / env move from the records to the resource, so Loki indexes
  # them as labels (service_name, env) like the OTLP signals.
  groupbyattrs/logs:
    keys: [service.name, service.version, env]

  # Spans: second gate behind the backend's SanitizingSpanExporter.
  transform/traces:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # --- SPAN_ATTRIBUTES + the `fitwise.` prefix (backend/app/telemetry/privacy.py) ---
          - keep_matching_keys(span.attributes, "^(?:http\\.method|http\\.request\\.method|http\\.route|http\\.status_code|http\\.response\\.status_code|http\\.scheme|url\\.scheme|http\\.flavor|network\\.protocol\\.version|server\\.address|server\\.port|net\\.host\\.name|net\\.host\\.port|net\\.peer\\.name|net\\.peer\\.port|net\\.transport|network\\.transport|network\\.peer\\.port|error\\.type|http\\.url|url\\.full|db\\.system|db\\.system\\.name|db\\.name|db\\.namespace|db\\.statement|db\\.query\\.text|db\\.operation|db\\.operation\\.name|db\\.collection\\.name|db\\.sql\\.table|exception\\.type|exception\\.escaped|user_hash|fitwise\\..+)$")
          # --- SENSITIVE_FIELD_NAMES as the last segment of a `fitwise.` key ---
          - delete_matching_keys(span.attributes, "^fitwise\\.(?:.+\\.)?(?:email|display_name|name|first_name|last_name|password|current_password|new_password|token|access_token|refresh_token|authorization|cookie|set_cookie|weight_kg|height_cm|body_fat_pct|neck_cm|waist_cm|hip_cm|food_name|note|notes|text|body|query|search_terms|user_id)$")
          - set(span.status.message, "")
      - context: spanevent
        statements:
          # Exception events keep the class name only (never exception.message / stacktrace).
          - keep_matching_keys(spanevent.attributes, "^exception\\.(?:type|escaped)$")

  # Metrics: labels outside METRIC_ATTRIBUTES are dropped (backend already applies the same view).
  transform/metrics:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          # --- METRIC_ATTRIBUTES (backend/app/telemetry/privacy.py) ---
          - keep_keys(datapoint.attributes, ["route", "method", "status", "kind", "rule", "decision", "outcome", "http.method", "http.request.method", "http.status_code", "http.response.status_code", "server.address", "net.peer.name", "error.type", "pool.name", "state", "db.client.connection.pool.name", "db.client.connection.state"])

  # Keep the sender's `env`; add it only when missing (action insert never overwrites).
  resource/env:
    attributes:
      - key: env
        value: ${env:FITWISE_ENV}
        action: insert

  # Logs forwarded by another collector (dev -> prod, #67). That collector already parsed, allow-listed
  # and scrubbed them, so the records carry only allow-listed attributes: the same attribute allow-list
  # is applied again here as a second gate (kept in sync with transform/logs by the allow-list test).
  transform/forwarded_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # A sender that does not gate (map/array/bytes body) must not skip the scrubbing below.
          - set(log.body, "") where not IsString(log.body)
          - keep_keys(log.attributes, ["service.name", "service.version", "env", "logger", "route", "method", "status", "duration_ms", "user_hash", "error_type", "check", "outcome", "kind", "rule", "decision", "engine", "count", "flag_key", "flag_old_value", "flag_new_value", "actor", "revision"])
          # keep_keys filters by key only: an allowed key holding a map, array or bytes is deleted.
          - delete_key(log.attributes, "route") where log.attributes["route"] != nil and not (IsString(log.attributes["route"]) or IsInt(log.attributes["route"]) or IsDouble(log.attributes["route"]) or IsBool(log.attributes["route"]))
          - delete_key(log.attributes, "method") where log.attributes["method"] != nil and not (IsString(log.attributes["method"]) or IsInt(log.attributes["method"]) or IsDouble(log.attributes["method"]) or IsBool(log.attributes["method"]))
          - delete_key(log.attributes, "status") where log.attributes["status"] != nil and not (IsString(log.attributes["status"]) or IsInt(log.attributes["status"]) or IsDouble(log.attributes["status"]) or IsBool(log.attributes["status"]))
          - delete_key(log.attributes, "duration_ms") where log.attributes["duration_ms"] != nil and not (IsString(log.attributes["duration_ms"]) or IsInt(log.attributes["duration_ms"]) or IsDouble(log.attributes["duration_ms"]) or IsBool(log.attributes["duration_ms"]))
          - delete_key(log.attributes, "user_hash") where log.attributes["user_hash"] != nil and not (IsString(log.attributes["user_hash"]) or IsInt(log.attributes["user_hash"]) or IsDouble(log.attributes["user_hash"]) or IsBool(log.attributes["user_hash"]))
          - delete_key(log.attributes, "error_type") where log.attributes["error_type"] != nil and not (IsString(log.attributes["error_type"]) or IsInt(log.attributes["error_type"]) or IsDouble(log.attributes["error_type"]) or IsBool(log.attributes["error_type"]))
          - delete_key(log.attributes, "check") where log.attributes["check"] != nil and not (IsString(log.attributes["check"]) or IsInt(log.attributes["check"]) or IsDouble(log.attributes["check"]) or IsBool(log.attributes["check"]))
          - delete_key(log.attributes, "outcome") where log.attributes["outcome"] != nil and not (IsString(log.attributes["outcome"]) or IsInt(log.attributes["outcome"]) or IsDouble(log.attributes["outcome"]) or IsBool(log.attributes["outcome"]))
          - delete_key(log.attributes, "kind") where log.attributes["kind"] != nil and not (IsString(log.attributes["kind"]) or IsInt(log.attributes["kind"]) or IsDouble(log.attributes["kind"]) or IsBool(log.attributes["kind"]))
          - delete_key(log.attributes, "rule") where log.attributes["rule"] != nil and not (IsString(log.attributes["rule"]) or IsInt(log.attributes["rule"]) or IsDouble(log.attributes["rule"]) or IsBool(log.attributes["rule"]))
          - delete_key(log.attributes, "decision") where log.attributes["decision"] != nil and not (IsString(log.attributes["decision"]) or IsInt(log.attributes["decision"]) or IsDouble(log.attributes["decision"]) or IsBool(log.attributes["decision"]))
          - delete_key(log.attributes, "engine") where log.attributes["engine"] != nil and not (IsString(log.attributes["engine"]) or IsInt(log.attributes["engine"]) or IsDouble(log.attributes["engine"]) or IsBool(log.attributes["engine"]))
          - delete_key(log.attributes, "count") where log.attributes["count"] != nil and not (IsString(log.attributes["count"]) or IsInt(log.attributes["count"]) or IsDouble(log.attributes["count"]) or IsBool(log.attributes["count"]))
          - delete_key(log.attributes, "flag_key") where log.attributes["flag_key"] != nil and not (IsString(log.attributes["flag_key"]) or IsInt(log.attributes["flag_key"]) or IsDouble(log.attributes["flag_key"]) or IsBool(log.attributes["flag_key"]))
          - delete_key(log.attributes, "flag_old_value") where log.attributes["flag_old_value"] != nil and not (IsString(log.attributes["flag_old_value"]) or IsInt(log.attributes["flag_old_value"]) or IsDouble(log.attributes["flag_old_value"]) or IsBool(log.attributes["flag_old_value"]))
          - delete_key(log.attributes, "flag_new_value") where log.attributes["flag_new_value"] != nil and not (IsString(log.attributes["flag_new_value"]) or IsInt(log.attributes["flag_new_value"]) or IsDouble(log.attributes["flag_new_value"]) or IsBool(log.attributes["flag_new_value"]))
          - delete_key(log.attributes, "actor") where log.attributes["actor"] != nil and not (IsString(log.attributes["actor"]) or IsInt(log.attributes["actor"]) or IsDouble(log.attributes["actor"]) or IsBool(log.attributes["actor"]))
          - delete_key(log.attributes, "revision") where log.attributes["revision"] != nil and not (IsString(log.attributes["revision"]) or IsInt(log.attributes["revision"]) or IsDouble(log.attributes["revision"]) or IsBool(log.attributes["revision"]))
          - delete_key(log.attributes, "logger") where log.attributes["logger"] != nil and not (IsString(log.attributes["logger"]) or IsInt(log.attributes["logger"]) or IsDouble(log.attributes["logger"]) or IsBool(log.attributes["logger"]))
          - delete_key(log.attributes, "service.name") where log.attributes["service.name"] != nil and not (IsString(log.attributes["service.name"]) or IsInt(log.attributes["service.name"]) or IsDouble(log.attributes["service.name"]) or IsBool(log.attributes["service.name"]))
          - delete_key(log.attributes, "service.version") where log.attributes["service.version"] != nil and not (IsString(log.attributes["service.version"]) or IsInt(log.attributes["service.version"]) or IsDouble(log.attributes["service.version"]) or IsBool(log.attributes["service.version"]))
          - delete_key(log.attributes, "env") where log.attributes["env"] != nil and not (IsString(log.attributes["env"]) or IsInt(log.attributes["env"]) or IsDouble(log.attributes["env"]) or IsBool(log.attributes["env"]))
          # Free-text severity / event name from the sender: only the known levels survive.
          - set(log.severity_text, "") where not IsMatch(log.severity_text, "^(?i:trace|debug|info|warn|warning|error|critical|fatal)$")
          - set(log.event_name, "")
          - replace_pattern(log.body, "[\\w.+-]+@[\\w-]+(\\.[\\w-]+)+", "[email]")
          - replace_pattern(log.body, "(?i)\\bbearer\\s+\\S+", "Bearer [token]")
          - replace_pattern(log.body, "\\beyJ[\\w-]+\\.[\\w-]+\\.[\\w-]+", "[token]")
          - set(log.body, Concat([Substring(log.body, 0, 256), "..."], "")) where Len(log.body) > 256

  # Resource and scope attributes: only what the backend sets (make_resource in
  # backend/app/telemetry/setup.py). Anything else a sender attaches (host.name, process.*,
  # telemetry.sdk.*, free-form attributes) is dropped, scope attributes entirely. Runs on every
  # pipeline BEFORE resource/env, so `env` is still inserted when the sender had none.
  transform/resource_allowlist:
    error_mode: ignore
    trace_statements: &resource_gate
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "env"])
          # Values are bounded too (they become Loki labels / Tempo service names). A value that is
          # not a string, or does not fit its shape, is deleted; a missing `env` is then inserted
          # from FITWISE_ENV by resource/env. Environments: APP_ENV values (.env.example, bootstrap).
          - delete_key(resource.attributes, "service.name") where resource.attributes["service.name"] != nil and not (IsString(resource.attributes["service.name"]) and IsMatch(resource.attributes["service.name"], "^fitwise-[a-z-]{1,40}$"))
          - delete_key(resource.attributes, "service.version") where resource.attributes["service.version"] != nil and not (IsString(resource.attributes["service.version"]) and IsMatch(resource.attributes["service.version"], "^[A-Za-z0-9._+-]{1,64}$"))
          - delete_key(resource.attributes, "env") where resource.attributes["env"] != nil and not (IsString(resource.attributes["env"]) and IsMatch(resource.attributes["env"], "^(?:local|dev|test|prod)$"))
          - delete_key(resource.attributes, "deployment.environment.name") where resource.attributes["deployment.environment.name"] != nil and not (IsString(resource.attributes["deployment.environment.name"]) and IsMatch(resource.attributes["deployment.environment.name"], "^(?:local|dev|test|prod)$"))
      - context: scope
        statements:
          - keep_keys(scope.attributes, [])
          # The instrumentation scope name / version are free text from the sender: cleared.
          - set(scope.name, "")
          - set(scope.version, "")
    metric_statements: *resource_gate
    log_statements: *resource_gate

  # Forwarded logs left with no body and no allowed attribute carry nothing: drop them.
  filter/empty_forwarded_logs:
    error_mode: ignore
    logs:
      log_record:
        - log.body == "" and Len(log.attributes) == 0

  batch:
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus' native OTLP receiver (--web.enable-otlp-receiver); exemplars included.
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls:
      insecure: true
  # Loki's native OTLP endpoint; index labels are configured in observability/loki/loki.yaml.
  otlp_http/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/traces, transform/resource_allowlist, resource/env, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/metrics, transform/resource_allowlist, resource/env, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [fluent_forward]
      processors: [memory_limiter, transform/logs, filter/unparsed_logs, groupbyattrs/logs, transform/resource_allowlist, resource/env, batch]
      exporters: [otlp_http/loki]
    # Logs sent by the dev collector over OTLP (already gated there); see transform/forwarded_logs.
    logs/forwarded:
      receivers: [otlp]
      processors: [memory_limiter, transform/forwarded_logs, transform/resource_allowlist, filter/empty_forwarded_logs, resource/env, batch]
      exporters: [otlp_http/loki]
