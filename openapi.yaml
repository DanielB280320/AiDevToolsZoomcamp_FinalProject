  schemas:
    # ───────── Primitives ─────────
    Id:
      type: string
      format: uuid
      example: 3f0b6a1e-6a55-4f3c-9a43-1c2a3a4b5c6d
    AthleteRef:
      description: An athlete user id or the literal `me`.
      anyOf:
        - type: string
          format: uuid
        - type: string
          const: me
    LocalDate:
      type: string
      format: date
      description: Calendar day in the athlete's time zone.
      example: '2026-11-03'
    Timestamp:
      type: string
      format: date-time
      description: UTC instant (RFC 3339, `Z` suffix).
      example: '2026-11-03T17:48:00Z'
    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    Kcal:
      type: integer
      description: Kilocalories (estimated, rounded).
    Grams:
      type: number
      minimum: 0
      description: Grams.
    Ratio:
      type: number
      minimum: 0
      maximum: 1
      description: Completion ratio 0–1 (actual ÷ target, capped at 1).
    Macros:
      type: object
      required: [kcal, protein_g, carbs_g, fat_g]
      properties:
        kcal:
          $ref: '#/components/schemas/Kcal'
        protein_g:
          $ref: '#/components/schemas/Grams'
        carbs_g:
          $ref: '#/components/schemas/Grams'
        fat_g:
          $ref: '#/components/schemas/Grams'
    Cursor:
      type: [string, 'null']
      description: Pass as `cursor` to get the next page; `null` on the last page.

    # ───────── Errors ─────────
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: '`/problems/<code>`.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable, safe to show to the user. Never contains health data.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[a-z0-9_]+$'
          description: |
            Stable machine-readable code. Known codes: `bad_request`, `invalid_range`,
            `range_too_large`, `not_authenticated`, `invalid_credentials`, `forbidden`,
            `wrong_role`, `not_linked`, `not_found`, `not_onboarded`, `email_taken`,
            `already_onboarded`, `plan_revision_conflict`, `day_occupied`, `session_finished`,
            `outside_week`, `date_in_past`,
            `edit_window_closed`, `suggestion_already_decided`, `link_exists`, `link_not_pending`,
            `validation_error`, `underage`, `disclaimer_required`, `rate_limited`,
            `off_unavailable`, `not_ready`. New codes may be added.
        errors:
          type: array
          description: Field-level errors — invalid parameters (400) or invalid request-body fields (422). `field` is the parameter name or the body path.
          items:
            $ref: '#/components/schemas/FieldError'
        request_id:
          type: string
          description: Correlates with server logs/traces.
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Dotted path to the offending field, e.g. `profile.preferred_days`.
        code:
          type: string
          description: e.g. `required`, `out_of_range`, `too_short`, `invalid_choice`, `mismatch`.
        message:
          type: string

    # ───────── Users & auth ─────────
    Role:
      type: string
      enum: [athlete, coach]
    Units:
      type: string
      enum: [metric, imperial]
      description: Display/input preference only; the API is always metric.
    Timezone:
      type: string
      description: IANA time zone name.
      minLength: 1
      maxLength: 64
      example: Europe/Madrid
    Email:
      type: string
      format: email
      maxLength: 254
    UserRef:
      type: object
      required: [id, display_name, role]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name, role, birth_date, units, timezone, accept_disclaimer]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        role:
          $ref: '#/components/schemas/Role'
        birth_date:
          type: string
          format: date
          description: Must make the user ≥ 18 today in `timezone` (F1.1).
        units:
          $ref: '#/components/schemas/Units'
        timezone:
          $ref: '#/components/schemas/Timezone'
        accept_disclaimer:
          type: boolean
          description: Must be `true` (F1.2); the server stores the acceptance time.
    LogInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    User:
      type: object
      required: [id, email, display_name, role, birth_date, units, timezone, disclaimer_accepted_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          $ref: '#/components/schemas/Email'
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        birth_date:
          type: string
          format: date
        units:
          $ref: '#/components/schemas/Units'
        timezone:
          $ref: '#/components/schemas/Timezone'
        disclaimer_accepted_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [onboarding_completed, active_coach, pending_coach_link_id, unread_notification_count]
          properties:
            onboarding_completed:
              type: boolean
              description: Athletes only; always `true` for coaches.
            active_coach:
              description: Athletes only; the actively linked coach.
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
            pending_coach_link_id:
              description: Athletes only; their pending link request.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            unread_notification_count:
              type: integer
              minimum: 0
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        units:
          $ref: '#/components/schemas/Units'
        timezone:
          $ref: '#/components/schemas/Timezone'
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Current password; wrong password → `403 forbidden`.

    # ───────── Athlete profile & targets ─────────
    Sex:
      type: string
      enum: [male, female, unspecified]
      description: '`unspecified` = "prefer not to say" (midpoint constants).'
    Lifestyle:
      type: string
      enum: [sedentary, lightly_active, active, very_active]
    Goal:
      type: string
      enum: [recomposition, muscle_gain, cutting, maintenance, wellness]
    Experience:
      type: string
      enum: [beginner, intermediate, advanced]
    TrainingEquipment:
      type: string
      enum: [full_gym, home_dumbbells, bodyweight_only]
    Diet:
      type: string
      enum: [omnivore, vegetarian, vegan, pescatarian]
    Allergen:
      type: string
      enum: [gluten, lactose, nuts, eggs, soy, shellfish, fish]
    AthleteProfileInput:
      type: object
      additionalProperties: false
      required: [sex, height_cm, lifestyle, goal, experience, days_per_week, preferred_days, session_minutes, equipment, diet, meals_per_day]
      properties:
        sex:
          $ref: '#/components/schemas/Sex'
        height_cm:
          type: number
          minimum: 120
          maximum: 230
        lifestyle:
          $ref: '#/components/schemas/Lifestyle'
        goal:
          $ref: '#/components/schemas/Goal'
        experience:
          $ref: '#/components/schemas/Experience'
        days_per_week:
          type: integer
          minimum: 2
          maximum: 6
        preferred_days:
          type: array
          description: Weekdays for sessions; length must equal `days_per_week` (F2.4).
          minItems: 2
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        session_minutes:
          type: integer
          enum: [30, 45, 60, 75, 90]
        equipment:
          $ref: '#/components/schemas/TrainingEquipment'
        avoided_exercise_ids:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/Id'
        diet:
          $ref: '#/components/schemas/Diet'
        allergies:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/Allergen'
        meals_per_day:
          type: integer
          enum: [3, 4, 5]
    AthleteProfile:
      type: object
      additionalProperties: false
      description: |
        `AthleteProfileInput` plus `athlete_id` and `updated_at`. The properties are referenced, not
        composed with `allOf`: `AthleteProfileInput` forbids additional properties, so an `allOf`
        of it would reject `athlete_id` and `updated_at` under strict validation.
      required: [athlete_id, sex, height_cm, lifestyle, goal, experience, days_per_week, preferred_days, session_minutes, equipment, avoided_exercise_ids, diet, allergies, meals_per_day, updated_at]
      properties:
        athlete_id:
          $ref: '#/components/schemas/Id'
        sex:
          $ref: '#/components/schemas/AthleteProfileInput/properties/sex'
        height_cm:
          $ref: '#/components/schemas/AthleteProfileInput/properties/height_cm'
        lifestyle:
          $ref: '#/components/schemas/AthleteProfileInput/properties/lifestyle'
        goal:
          $ref: '#/components/schemas/AthleteProfileInput/properties/goal'
        experience:
          $ref: '#/components/schemas/AthleteProfileInput/properties/experience'
        days_per_week:
          $ref: '#/components/schemas/AthleteProfileInput/properties/days_per_week'
        preferred_days:
          $ref: '#/components/schemas/AthleteProfileInput/properties/preferred_days'
        session_minutes:
          $ref: '#/components/schemas/AthleteProfileInput/properties/session_minutes'
        equipment:
          $ref: '#/components/schemas/AthleteProfileInput/properties/equipment'
        avoided_exercise_ids:
          $ref: '#/components/schemas/AthleteProfileInput/properties/avoided_exercise_ids'
        diet:
          $ref: '#/components/schemas/AthleteProfileInput/properties/diet'
        allergies:
          $ref: '#/components/schemas/AthleteProfileInput/properties/allergies'
        meals_per_day:
          $ref: '#/components/schemas/AthleteProfileInput/properties/meals_per_day'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    BodyFatMethod:
      type: string
      enum: [entered, navy]
      description: '`entered` = known value typed in; `navy` = estimated from tape measurements (F3.3).'
    OnboardingBodyMetric:
      type: object
      additionalProperties: false
      required: [weight_kg, body_fat_method]
      description: |
        `body_fat_method`: `entered` requires `body_fat_pct`; `navy` requires `neck_cm` and
        `waist_cm` (plus `hip_cm` for female/unspecified); `skip` uses neither.
      properties:
        weight_kg:
          type: number
          minimum: 35
          maximum: 300
        body_fat_method:
          type: string
          enum: [entered, navy, skip]
        body_fat_pct:
          type: number
          minimum: 3
          maximum: 60
        neck_cm:
          $ref: '#/components/schemas/MeasurementCm'
        waist_cm:
          $ref: '#/components/schemas/MeasurementCm'
        hip_cm:
          $ref: '#/components/schemas/MeasurementCm'
    MeasurementCm:
      type: number
      minimum: 20
      maximum: 200
      description: Circumference in cm (F2.3).
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [profile, body_metric]
      properties:
        profile:
          $ref: '#/components/schemas/AthleteProfileInput'
        body_metric:
          $ref: '#/components/schemas/OnboardingBodyMetric'
    OnboardingResult:
      type: object
      required: [profile, body_metric, targets, plan]
      properties:
        profile:
          $ref: '#/components/schemas/AthleteProfile'
        body_metric:
          $ref: '#/components/schemas/BodyMetric'
        targets:
          $ref: '#/components/schemas/Targets'
        plan:
          $ref: '#/components/schemas/Plan'
    ProfileUpdateResult:
      type: object
      required: [profile, targets, targets_changed]
      properties:
        profile:
          $ref: '#/components/schemas/AthleteProfile'
        targets:
          $ref: '#/components/schemas/Targets'
        targets_changed:
          type: boolean
          description: '`true` when new targets were computed from today.'
    Targets:
      type: object
      description: Daily targets (F3). All values are estimates.
      required:
        - id
        - athlete_id
        - valid_from
        - estimated
        - bmr_formula
        - bmr_kcal
        - lifestyle_factor
        - baseline_kcal
        - planned_exercise_kcal_per_day
        - goal_adjustment_pct
        - kcal
        - protein_g
        - carbs_g
        - fat_g
        - target_balance_kcal
        - floor_applied
        - floor_kcal
        - carbs_clamped
        - weight_used_kg
        - body_fat_pct_used
        - explanation
        - inputs
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        athlete_id:
          $ref: '#/components/schemas/Id'
        valid_from:
          $ref: '#/components/schemas/LocalDate'
        estimated:
          type: boolean
          const: true
        bmr_formula:
          type: string
          enum: [katch_mcardle, mifflin_st_jeor]
          description: Katch-McArdle if and only if a body-fat value exists (F3.2).
        bmr_kcal:
          $ref: '#/components/schemas/Kcal'
        lifestyle_factor:
          type: number
          enum: [1.2, 1.3, 1.45, 1.6]
        baseline_kcal:
          $ref: '#/components/schemas/Kcal'
        planned_exercise_kcal_per_day:
          $ref: '#/components/schemas/Kcal'
        goal_adjustment_pct:
          type: number
          description: e.g. `-20` for cutting.
        kcal:
          $ref: '#/components/schemas/Kcal'
        protein_g:
          $ref: '#/components/schemas/Grams'
        carbs_g:
          $ref: '#/components/schemas/Grams'
        fat_g:
          $ref: '#/components/schemas/Grams'
        target_balance_kcal:
          type: integer
          description: |
            The goal's target daily balance (eaten − burned): `kcal − (baseline_kcal +
            planned_exercise_kcal_per_day)`. Negative for a deficit.
        floor_applied:
          type: boolean
          description: The calorie floor raised the target (F3.6); the explanation says so.
        floor_kcal:
          $ref: '#/components/schemas/Kcal'
        carbs_clamped:
          type: boolean
          description: Carbs were clamped at 0 (F3.4); explained.
        weight_used_kg:
          type: number
          description: Body weight the targets were computed from (kg).
        body_fat_pct_used:
          type: [number, 'null']
        explanation:
          type: string
          description: Human-readable formulas and inputs used (F3.5).
        inputs:
          type: object
          additionalProperties: true
          description: Engine inputs as stored (for audit and tests).
        created_at:
          $ref: '#/components/schemas/Timestamp'

    # ───────── Body ─────────
    BodyMetricInput:
      type: object
      additionalProperties: false
      required: [date]
      minProperties: 2
      description: At least one of weight, body fat or measurements.
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        weight_kg:
          type: number
          minimum: 35
          maximum: 300
        body_fat_pct:
          type: number
          minimum: 3
          maximum: 60
          description: Known value. Omit and send measurements to use the Navy method.
        neck_cm:
          $ref: '#/components/schemas/MeasurementCm'
        waist_cm:
          $ref: '#/components/schemas/MeasurementCm'
        hip_cm:
          $ref: '#/components/schemas/MeasurementCm'
    BodyMetric:
      type: object
      required: [id, date, weight_kg, body_fat_pct, body_fat_method, body_fat_explanation, neck_cm, waist_cm, hip_cm, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        date:
          $ref: '#/components/schemas/LocalDate'
        weight_kg:
          type: [number, 'null']
        body_fat_pct:
          type: [number, 'null']
          description: Estimated when `body_fat_method` is `navy`.
        body_fat_method:
          oneOf:
            - $ref: '#/components/schemas/BodyFatMethod'
            - type: 'null'
        body_fat_explanation:
          type: [string, 'null']
          description: Navy formula and inputs, when estimated.
        neck_cm:
          type: [number, 'null']
        waist_cm:
          type: [number, 'null']
        hip_cm:
          type: [number, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
    BodyMetricList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BodyMetric'
    BodyMetricResult:
      type: object
      required: [body_metric, recalc_suggestion]
      properties:
        body_metric:
          $ref: '#/components/schemas/BodyMetric'
        recalc_suggestion:
          description: Created when weight moved ≥ 2 % from the weight used for current targets.
          oneOf:
            - $ref: '#/components/schemas/Suggestion'
            - type: 'null'

    # ───────── Catalog ─────────
    MuscleGroup:
      type: string
      enum: [chest, back, shoulders, biceps, triceps, forearms, core, quads, hamstrings, glutes, calves, full_body, cardio]
    ExerciseEquipment:
      type: string
      enum: [barbell, dumbbell, machine, cable, bodyweight, band, cardio_machine, none]
    ExerciseType:
      type: string
      enum: [strength, bodyweight, timed]
      description: '`timed` covers holds and cardio.'
    BodyRegion:
      type: string
      enum: [upper, lower, full, cardio]
    ExerciseSummary:
      type: object
      required: [id, name, type, equipment, muscle_group]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        type:
          $ref: '#/components/schemas/ExerciseType'
        equipment:
          $ref: '#/components/schemas/ExerciseEquipment'
        muscle_group:
          $ref: '#/components/schemas/MuscleGroup'
    ExerciseInput:
      description: Request body of `createExercise`; unknown properties are rejected.
      allOf:
        - $ref: '#/components/schemas/ExerciseFields'
      unevaluatedProperties: false
    ExerciseFields:
      type: object
      description: Properties shared by `ExerciseInput` and `Exercise`.
      required: [name, muscle_group, equipment, type, met, region]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        muscle_group:
          $ref: '#/components/schemas/MuscleGroup'
        equipment:
          $ref: '#/components/schemas/ExerciseEquipment'
        type:
          $ref: '#/components/schemas/ExerciseType'
        met:
          type: number
          minimum: 1
          maximum: 20
        increment_kg:
          type: number
          minimum: 0
          maximum: 20
          default: 2.5
        region:
          $ref: '#/components/schemas/BodyRegion'
        allows_added_weight:
          type: boolean
          default: false
          description: >-
            True for bodyweight exercises that can take extra load (belt, vest, dumbbell), so the
            progression engine may add weight once the rep target is reached.
    Exercise:
      allOf:
        - $ref: '#/components/schemas/ExerciseFields'
        - type: object
          required: [id, increment_kg, allows_added_weight, is_custom, owner]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            is_custom:
              type: boolean
            owner:
              description: Creator of a custom exercise; `null` for seed exercises.
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
    ExercisePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    FoodSource:
      type: string
      enum: [seed, custom, openfoodfacts]
    DietTag:
      type: string
      enum: [vegetarian, vegan, pescatarian]
      description: Diets the food is suitable for (every food suits `omnivore`).
    Per100g:
      type: object
      required: [kcal_per_100g, protein_g_per_100g, carbs_g_per_100g, fat_g_per_100g]
      properties:
        kcal_per_100g:
          type: number
          minimum: 0
          maximum: 900
        protein_g_per_100g:
          type: number
          minimum: 0
          maximum: 100
        carbs_g_per_100g:
          type: number
          minimum: 0
          maximum: 100
        fat_g_per_100g:
          type: number
          minimum: 0
          maximum: 100
    FoodInput:
      allOf:
        - $ref: '#/components/schemas/Per100g'
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            brand:
              type: [string, 'null']
              maxLength: 80
            diet_tags:
              type: array
              uniqueItems: true
              default: []
              items:
                $ref: '#/components/schemas/DietTag'
            allergen_tags:
              type: array
              uniqueItems: true
              default: []
              items:
                $ref: '#/components/schemas/Allergen'
    FoodSummary:
      type: object
      required: [id, name, source]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        source:
          $ref: '#/components/schemas/FoodSource'
    Food:
      allOf:
        - $ref: '#/components/schemas/FoodInput'
        - type: object
          required: [id, source, external_code, brand, diet_tags, allergen_tags, owner]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            source:
              $ref: '#/components/schemas/FoodSource'
            external_code:
              type: [string, 'null']
              description: Open Food Facts product code (unique) for imported foods.
            owner:
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
    FoodPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Food'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    OffProduct:
      allOf:
        - $ref: '#/components/schemas/Per100g'
        - type: object
          required: [code, name, brand, imported_food_id]
          properties:
            code:
              type: string
            name:
              type: string
            brand:
              type: [string, 'null']
            imported_food_id:
              description: Local food id if already imported.
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
    OffSearchResult:
      type: object
      required: [available, unavailable_reason, message, items]
      properties:
        available:
          type: boolean
        unavailable_reason:
          type: [string, 'null']
          enum: [disabled, timeout, upstream_error, null]
        message:
          type: [string, 'null']
          description: User-facing message when unavailable.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OffProduct'
    FoodImportRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{4,14}$'
          description: Open Food Facts product code from a search result.
    MealSlot:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    FoodGrams:
      type: object
      additionalProperties: false
      required: [food_id, grams]
      properties:
        food_id:
          $ref: '#/components/schemas/Id'
        grams:
          type: number
          exclusiveMinimum: 0
          maximum: 2000
    MealItem:
      allOf:
        - $ref: '#/components/schemas/Macros'
        - type: object
          required: [food, grams]
          description: A food in a meal; macros = per-100 g × grams ÷ 100 (F6.1).
          properties:
            food:
              $ref: '#/components/schemas/FoodSummary'
            grams:
              $ref: '#/components/schemas/Grams'
    MealInput:
      type: object
      additionalProperties: false
      required: [name, slots, items]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slots:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MealSlot'
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/FoodGrams'
    MealSummary:
      type: object
      required: [id, name, slots]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/MealSlot'
    Meal:
      allOf:
        - $ref: '#/components/schemas/MealSummary'
        - type: object
          required: [items, totals, diet_tags, allergen_tags, is_custom, owner]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MealItem'
            totals:
              $ref: '#/components/schemas/Macros'
            diet_tags:
              type: array
              description: Diets every food in the meal suits.
              items:
                $ref: '#/components/schemas/DietTag'
            allergen_tags:
              type: array
              description: Union of the foods' allergens.
              items:
                $ref: '#/components/schemas/Allergen'
            is_custom:
              type: boolean
            owner:
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
    MealPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Meal'
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    # ───────── Plan ─────────
    PlanSource:
      type: string
      enum: [generated, custom]
    ProgressionRule:
      type: string
      enum: [linear, double, manual]
      description: Bodyweight and timed exercises progress by their type (F11) unless `manual`.
    PlannedExerciseInput:
      type: object
      additionalProperties: false
      required: [exercise_id, sets, rest_seconds, rule]
      description: |
        Strength/bodyweight need `reps_min` (and `reps_max` ≥ `reps_min`; equal = fixed reps).
        Timed need `target_seconds`. `target_weight_kg: null` = calibration (choose a weight).
        For bodyweight exercises `target_weight_kg` is *added* weight.
      properties:
        id:
          description: Existing planned exercise to update; omit to add.
          $ref: '#/components/schemas/Id'
        exercise_id:
          $ref: '#/components/schemas/Id'
        sets:
          type: integer
          minimum: 1
          maximum: 10
        reps_min:
          type: [integer, 'null']
          minimum: 1
          maximum: 100
        reps_max:
          type: [integer, 'null']
          minimum: 1
          maximum: 100
        target_weight_kg:
          type: [number, 'null']
          minimum: 0
          maximum: 500
        target_seconds:
          type: [integer, 'null']
          minimum: 5
          maximum: 14400
        rest_seconds:
          type: integer
          minimum: 0
          maximum: 600
          default: 90
        rule:
          $ref: '#/components/schemas/ProgressionRule'
        increment_kg:
          type: number
          minimum: 0
          maximum: 20
          description: Defaults to the exercise's increment.
        deload_enabled:
          type: boolean
          default: true
    PlannedExercise:
      type: object
      required: [id, exercise, order, sets, reps_min, reps_max, target_weight_kg, target_seconds, rest_seconds, rule, increment_kg, deload_enabled, calibration_hint]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        exercise:
          $ref: '#/components/schemas/ExerciseSummary'
        order:
          type: integer
          minimum: 0
        sets:
          type: integer
        reps_min:
          type: [integer, 'null']
        reps_max:
          type: [integer, 'null']
        target_weight_kg:
          type: [number, 'null']
          description: '`null` until calibrated (F5.4).'
        target_seconds:
          type: [integer, 'null']
        rest_seconds:
          type: integer
        rule:
          $ref: '#/components/schemas/ProgressionRule'
        increment_kg:
          type: number
        deload_enabled:
          type: boolean
        calibration_hint:
          type: [string, 'null']
          description: Shown while `target_weight_kg` is null, e.g. "Choose a weight you can do for the target reps with 2 reps left".
    TrainingDayInput:
      type: object
      additionalProperties: false
      required: [weekday, name, exercises]
      properties:
        id:
          description: Existing training day to update; omit to add.
          $ref: '#/components/schemas/Id'
        weekday:
          $ref: '#/components/schemas/Weekday'
        name:
          type: string
          minLength: 1
          maxLength: 60
        exercises:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PlannedExerciseInput'
    TrainingDay:
      type: object
      required: [id, weekday, name, order, exercises, estimated_minutes, planned_kcal, edited_by]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        weekday:
          $ref: '#/components/schemas/Weekday'
        name:
          type: string
        order:
          type: integer
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/PlannedExercise'
        estimated_minutes:
          type: integer
          description: Estimated session duration (F5.1).
        planned_kcal:
          $ref: '#/components/schemas/Kcal'
        edited_by:
          description: Last editor when the day was edited by hand; shown as "edited by <coach name>" for coaches (F8).
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
    PlannedMealInput:
      type: object
      additionalProperties: false
      required: [slot, meal_id]
      properties:
        id:
          description: Existing planned meal to update; omit to add.
          $ref: '#/components/schemas/Id'
        slot:
          $ref: '#/components/schemas/MealSlot'
        meal_id:
          $ref: '#/components/schemas/Id'
        portion_factor:
          type: number
          minimum: 0.25
          maximum: 3
          default: 1
        items:
          type: array
          description: Optional gram overrides for this planned meal (stored as an athlete-owned copy of the meal).
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/FoodGrams'
    PlannedMeal:
      type: object
      required: [id, slot, order, meal, portion_factor, items, totals]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slot:
          $ref: '#/components/schemas/MealSlot'
        order:
          type: integer
        meal:
          $ref: '#/components/schemas/MealSummary'
        portion_factor:
          type: number
        items:
          type: array
          description: Foods with grams already scaled by `portion_factor`.
          items:
            $ref: '#/components/schemas/MealItem'
        totals:
          $ref: '#/components/schemas/Macros'
    MealDayInput:
      type: object
      additionalProperties: false
      required: [weekday, meals]
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        meals:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PlannedMealInput'
    MealDay:
      type: object
      required: [id, weekday, meals, totals, warning, edited_by]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        weekday:
          $ref: '#/components/schemas/Weekday'
        meals:
          type: array
          items:
            $ref: '#/components/schemas/PlannedMeal'
        totals:
          $ref: '#/components/schemas/Macros'
        warning:
          type: [string, 'null']
          description: Generator warning when targets could not be hit (F7).
        edited_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
    Plan:
      type: object
      required: [id, athlete_id, version, source, active, revision, created_by, created_at, updated_at, training_days, meal_days, warnings]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        athlete_id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        source:
          $ref: '#/components/schemas/PlanSource'
        active:
          type: boolean
          description: Only the active version is editable.
        revision:
          type: integer
          minimum: 0
          description: Optimistic-concurrency counter; send it back with plan updates.
        created_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        training_days:
          type: array
          description: Ordered Monday → Sunday; weekdays not listed are rest days.
          items:
            $ref: '#/components/schemas/TrainingDay'
        meal_days:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/MealDay'
        warnings:
          type: array
          items:
            type: string
    TrainingPlanUpdate:
      type: object
      additionalProperties: false
      required: [revision, training_days]
      properties:
        revision:
          type: integer
          minimum: 0
        training_days:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/TrainingDayInput'
    MealPlanUpdate:
      type: object
      additionalProperties: false
      required: [revision, meal_days]
      properties:
        revision:
          type: integer
          minimum: 0
        meal_days:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/MealDayInput'
    RegeneratePlanRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [all, training, meals]
          default: all
    PlanVersionSummary:
      type: object
      required: [id, version, source, active, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
        source:
          $ref: '#/components/schemas/PlanSource'
        active:
          type: boolean
        created_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PlanVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersionSummary'

    # ───────── Sessions & logging ─────────
    SessionStatus:
      type: string
      enum: [planned, in_progress, done, missed]
    SetLogInput:
      type: object
      additionalProperties: false
      required: [exercise_id, set_no]
      description: |
        Strength: `reps` + `weight_kg`. Bodyweight: `reps` (+ optional added `weight_kg`).
        Timed: `seconds` (+ optional `distance_m`). Or `as_planned: true` / `skipped: true` alone.
      properties:
        exercise_id:
          $ref: '#/components/schemas/Id'
        planned_exercise_id:
          description: '`null` for an exercise added to the session (extra).'
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        set_no:
          type: integer
          minimum: 1
          maximum: 30
        as_planned:
          type: boolean
          default: false
        skipped:
          type: boolean
          default: false
        reps:
          type: integer
          minimum: 0
          maximum: 1000
        weight_kg:
          type: number
          minimum: 0
          maximum: 1000
        seconds:
          type: integer
          minimum: 0
          maximum: 86400
        distance_m:
          type: number
          minimum: 0
          maximum: 1000000
    SetLog:
      type: object
      required: [id, session_id, planned_exercise_id, exercise_id, set_no, skipped, target_reps, target_weight_kg, target_seconds, reps, weight_kg, seconds, distance_m, logged_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        planned_exercise_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        exercise_id:
          $ref: '#/components/schemas/Id'
        set_no:
          type: integer
        skipped:
          type: boolean
        target_reps:
          type: [integer, 'null']
          description: Snapshot of the target at logging time.
        target_weight_kg:
          type: [number, 'null']
          description: Snapshot.
        target_seconds:
          type: [integer, 'null']
          description: Snapshot.
        reps:
          type: [integer, 'null']
        weight_kg:
          type: [number, 'null']
        seconds:
          type: [integer, 'null']
        distance_m:
          type: [number, 'null']
        logged_at:
          $ref: '#/components/schemas/Timestamp'
    SessionSet:
      type: object
      required: [set_no, is_extra, target_reps, target_weight_kg, target_seconds, log]
      properties:
        set_no:
          type: integer
        is_extra:
          type: boolean
        target_reps:
          type: [integer, 'null']
          description: For rep ranges, the current target within the range.
        target_weight_kg:
          type: [number, 'null']
        target_seconds:
          type: [integer, 'null']
        log:
          oneOf:
            - $ref: '#/components/schemas/SetLog'
            - type: 'null'
    SessionExercise:
      type: object
      required: [planned_exercise_id, exercise, order, is_extra, rule, sets, reps_min, reps_max, rest_seconds, calibration_hint, completion, pending_suggestion_id]
      properties:
        planned_exercise_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        exercise:
          $ref: '#/components/schemas/ExerciseSummary'
        order:
          type: integer
        is_extra:
          type: boolean
        rule:
          oneOf:
            - $ref: '#/components/schemas/ProgressionRule'
            - type: 'null'
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SessionSet'
        reps_min:
          type: [integer, 'null']
        reps_max:
          type: [integer, 'null']
        rest_seconds:
          type: integer
          description: Rest-timer duration after each set.
        calibration_hint:
          type: [string, 'null']
        completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        pending_suggestion_id:
          description: Set when a suggestion for this exercise is pending — the session uses current targets and shows a banner (F11).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
    Session:
      type: object
      required: [id, athlete_id, plan_id, plan_version, training_day_id, training_day_name, date, original_date, status, started_at, finished_at, editable_until, completion, kcal, estimated, exercises]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        athlete_id:
          $ref: '#/components/schemas/Id'
        plan_id:
          $ref: '#/components/schemas/Id'
        plan_version:
          type: integer
        training_day_id:
          $ref: '#/components/schemas/Id'
        training_day_name:
          type: string
        date:
          $ref: '#/components/schemas/LocalDate'
        original_date:
          description: Planned date before a move; `null` if not moved.
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        status:
          $ref: '#/components/schemas/SessionStatus'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        editable_until:
          description: End of the edit window (day after the session date, athlete's time zone, in UTC).
          $ref: '#/components/schemas/Timestamp'
        completion:
          description: Σ min(actual, target) ÷ Σ target over planned working sets (F10.2); `null` until something is logged.
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        kcal:
          description: Estimated exercise kcal (F13.2); `null` until finished.
          oneOf:
            - $ref: '#/components/schemas/Kcal'
            - type: 'null'
        estimated:
          type: boolean
          const: true
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/SessionExercise'
    MoveSessionRequest:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
    FinishSessionRequest:
      type: object
      additionalProperties: false
      properties:
        finished_at:
          description: Defaults to now.
          $ref: '#/components/schemas/Timestamp'
    FinishSessionResult:
      type: object
      required: [session, suggestions]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        suggestions:
          type: array
          description: Pending progression suggestions created by this finish.
          items:
            $ref: '#/components/schemas/Suggestion'
    MealLogStatus:
      type: string
      enum: [eaten, adjusted, skipped, extra]
    MealLogInput:
      type: object
      additionalProperties: false
      required: [date, planned_meal_id, status]
      description: |
        `eaten`/`skipped`: no `items` (eaten copies the planned grams). `adjusted`: `items` required.
        `extra`: `planned_meal_id: null`, `items` required, `slot` optional.
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        planned_meal_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        status:
          $ref: '#/components/schemas/MealLogStatus'
        slot:
          $ref: '#/components/schemas/MealSlot'
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/FoodGrams'
    MealLog:
      type: object
      required: [id, date, planned_meal_id, status, slot, items, totals, logged_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        date:
          $ref: '#/components/schemas/LocalDate'
        planned_meal_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        status:
          $ref: '#/components/schemas/MealLogStatus'
        slot:
          oneOf:
            - $ref: '#/components/schemas/MealSlot'
            - type: 'null'
        items:
          type: array
          description: Logged quantities (empty when skipped).
          items:
            $ref: '#/components/schemas/MealItem'
        totals:
          $ref: '#/components/schemas/Macros'
        logged_at:
          $ref: '#/components/schemas/Timestamp'
    MealLogResult:
      allOf:
        - $ref: '#/components/schemas/DayEnergyUpdate'
        - type: object
          required: [meal_log]
          properties:
            meal_log:
              $ref: '#/components/schemas/MealLog'
    ActivityInput:
      type: object
      additionalProperties: false
      required: [date, exercise_id, minutes]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        exercise_id:
          $ref: '#/components/schemas/Id'
        minutes:
          type: integer
          minimum: 1
          maximum: 600
    Activity:
      type: object
      required: [id, date, exercise, minutes, kcal, estimated, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        date:
          $ref: '#/components/schemas/LocalDate'
        exercise:
          $ref: '#/components/schemas/ExerciseSummary'
        minutes:
          type: integer
        kcal:
          $ref: '#/components/schemas/Kcal'
        estimated:
          type: boolean
          const: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ActivityResult:
      allOf:
        - $ref: '#/components/schemas/DayEnergyUpdate'
        - type: object
          required: [activity]
          properties:
            activity:
              $ref: '#/components/schemas/Activity'
    DayEnergyUpdate:
      type: object
      required: [energy, nutrition_completion]
      properties:
        energy:
          $ref: '#/components/schemas/EnergyBalance'
        nutrition_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'

    # ───────── Day / calendar ─────────
    EnergyBalance:
      type: object
      description: Estimated daily energy balance (F13). All numbers are estimates.
      required: [date, estimated, eaten, planned, target, burned, balance_kcal, target_balance_kcal]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        estimated:
          type: boolean
          const: true
        eaten:
          description: From logged quantities only (F12.1).
          $ref: '#/components/schemas/Macros'
        planned:
          description: Sum of the day's planned meals.
          $ref: '#/components/schemas/Macros'
        target:
          description: Daily targets valid on this date (for macro progress bars).
          $ref: '#/components/schemas/Macros'
        burned:
          $ref: '#/components/schemas/Burned'
        balance_kcal:
          type: integer
          description: '`eaten.kcal − burned.total_kcal`.'
        target_balance_kcal:
          type: integer
          description: The goal's target balance (see `Targets.target_balance_kcal`).
    Burned:
      type: object
      required: [total_kcal, baseline_kcal, training_kcal, activities_kcal]
      description: Baseline (BMR × lifestyle) + logged training + extra activities (F13.1), using the most recent weight on or before the date.
      properties:
        total_kcal:
          $ref: '#/components/schemas/Kcal'
        baseline_kcal:
          $ref: '#/components/schemas/Kcal'
        training_kcal:
          $ref: '#/components/schemas/Kcal'
        activities_kcal:
          $ref: '#/components/schemas/Kcal'
    DayMeal:
      type: object
      required: [planned_meal, log]
      properties:
        planned_meal:
          $ref: '#/components/schemas/PlannedMeal'
        log:
          description: '`null` = not checked off yet (counts as 0 eaten).'
          oneOf:
            - $ref: '#/components/schemas/MealLog'
            - type: 'null'
    TrainingStatus:
      type: string
      enum: [rest, planned, in_progress, done, missed]
      description: '`rest` = no session that day (never missed). `missed` = past planned session without logs (F9.3).'
    DayView:
      type: object
      required: [date, weekday, is_today, training_status, session, meals, extra_meal_logs, activities, energy, training_completion, nutrition_completion, pending_suggestions, weigh_in_hint, notes, meal_warning]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        weekday:
          $ref: '#/components/schemas/Weekday'
        is_today:
          type: boolean
        training_status:
          $ref: '#/components/schemas/TrainingStatus'
        session:
          description: '`null` on rest days.'
          oneOf:
            - $ref: '#/components/schemas/Session'
            - type: 'null'
        meals:
          type: array
          description: Planned meals in slot order with their check-off state.
          items:
            $ref: '#/components/schemas/DayMeal'
        extra_meal_logs:
          type: array
          items:
            $ref: '#/components/schemas/MealLog'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        energy:
          $ref: '#/components/schemas/EnergyBalance'
        training_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        nutrition_completion:
          description: Planned meals eaten or adjusted ÷ planned meals (F12.2).
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        pending_suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
        weigh_in_hint:
          description: Same as `SuggestionList.weigh_in_hint`; set only when `date` is in the current week.
          oneOf:
            - $ref: '#/components/schemas/WeighInHint'
            - type: 'null'
        notes:
          type: array
          description: Coach notes for this day, its session and its exercises.
          items:
            $ref: '#/components/schemas/Note'
        meal_warning:
          type: [string, 'null']
    CalendarDay:
      type: object
      required: [date, weekday, is_today, training_status, session_id, training_day_name, moved, training_completion, nutrition_completion, planned_meal_count, eaten_meal_count, energy]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        weekday:
          $ref: '#/components/schemas/Weekday'
        is_today:
          type: boolean
        training_status:
          $ref: '#/components/schemas/TrainingStatus'
        session_id:
          description: '`null` for rest days and for future sessions not yet materialised.'
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        training_day_name:
          type: [string, 'null']
        moved:
          type: boolean
          description: The session on this day was moved here from another day.
        training_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        nutrition_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        planned_meal_count:
          type: integer
          minimum: 0
        eaten_meal_count:
          type: integer
          minimum: 0
        energy:
          $ref: '#/components/schemas/EnergyBalance'
    CalendarRange:
      type: object
      required: [from, to, timezone, days]
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        timezone:
          $ref: '#/components/schemas/Timezone'
        days:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'

    # ───────── Suggestions ─────────
    SuggestionKind:
      type: string
      enum: [progression, calories, recalc]
    SuggestionStatus:
      type: string
      enum: [pending, accepted, rejected]
    SuggestionRule:
      type: string
      enum: [linear, double, deload, bodyweight, timed, calibration, adaptive_calories, weight_change]
    SuggestionBase:
      type: object
      required: [id, athlete_id, kind, status, rule, reason, inputs, created_at, decided_by, decided_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        athlete_id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/SuggestionKind'
        status:
          $ref: '#/components/schemas/SuggestionStatus'
        rule:
          $ref: '#/components/schemas/SuggestionRule'
        reason:
          type: string
          description: Human-readable rule and numbers (F11.4), e.g. "All 3 sets reached 12 reps at 40 kg → 42.5 kg × 8".
        inputs:
          type: object
          additionalProperties: true
          description: Engine inputs as stored.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        decided_by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        decided_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ExerciseTargets:
      type: object
      required: [target_weight_kg, reps_min, reps_max, target_seconds]
      properties:
        target_weight_kg:
          type: [number, 'null']
        reps_min:
          type: [integer, 'null']
        reps_max:
          type: [integer, 'null']
        target_seconds:
          type: [integer, 'null']
    ProgressionPayload:
      type: object
      required: [exercise, planned_exercise_id, source_session_id, current, proposed, hint, applied]
      properties:
        exercise:
          $ref: '#/components/schemas/ExerciseSummary'
        planned_exercise_id:
          $ref: '#/components/schemas/Id'
        source_session_id:
          $ref: '#/components/schemas/Id'
        current:
          $ref: '#/components/schemas/ExerciseTargets'
        proposed:
          $ref: '#/components/schemas/ExerciseTargets'
        hint:
          type: [string, 'null']
          description: e.g. "Ready for a harder variation" (bodyweight at top of range).
        applied:
          description: Values that became the targets on accept (after edits).
          oneOf:
            - $ref: '#/components/schemas/ExerciseTargets'
            - type: 'null'
    CaloriesPayload:
      type: object
      required: [current_kcal, proposed_kcal, delta_kcal, floor_applied, expected_weekly_change_pct, tolerance_pct, observed_weekly_change_pct, applied_kcal]
      properties:
        current_kcal:
          $ref: '#/components/schemas/Kcal'
        proposed_kcal:
          $ref: '#/components/schemas/Kcal'
        delta_kcal:
          type: integer
          enum: [-150, 150]
        floor_applied:
          type: boolean
        expected_weekly_change_pct:
          type: number
        tolerance_pct:
          type: number
        observed_weekly_change_pct:
          type: array
          description: 7-day-average trend for the two complete weeks, oldest first.
          minItems: 2
          maxItems: 2
          items:
            type: number
        applied_kcal:
          oneOf:
            - $ref: '#/components/schemas/Kcal'
            - type: 'null'
    RecalcPayload:
      type: object
      required: [weight_used_kg, new_weight_kg, change_pct, current, proposed]
      properties:
        weight_used_kg:
          type: number
        new_weight_kg:
          type: number
        change_pct:
          type: number
        current:
          $ref: '#/components/schemas/Macros'
        proposed:
          $ref: '#/components/schemas/Macros'
    ProgressionSuggestion:
      allOf:
        - $ref: '#/components/schemas/SuggestionBase'
        - type: object
          required: [kind, payload]
          properties:
            kind:
              type: string
              const: progression
            payload:
              $ref: '#/components/schemas/ProgressionPayload'
    CaloriesSuggestion:
      allOf:
        - $ref: '#/components/schemas/SuggestionBase'
        - type: object
          required: [kind, payload]
          properties:
            kind:
              type: string
              const: calories
            payload:
              $ref: '#/components/schemas/CaloriesPayload'
    RecalcSuggestion:
      allOf:
        - $ref: '#/components/schemas/SuggestionBase'
        - type: object
          required: [kind, payload]
          properties:
            kind:
              type: string
              const: recalc
            payload:
              $ref: '#/components/schemas/RecalcPayload'
    Suggestion:
      description: A pending or decided suggestion; `payload` shape depends on `kind`.
      oneOf:
        - $ref: '#/components/schemas/ProgressionSuggestion'
        - $ref: '#/components/schemas/CaloriesSuggestion'
        - $ref: '#/components/schemas/RecalcSuggestion'
      discriminator:
        propertyName: kind
        mapping:
          progression: '#/components/schemas/ProgressionSuggestion'
          calories: '#/components/schemas/CaloriesSuggestion'
          recalc: '#/components/schemas/RecalcSuggestion'
    SuggestionList:
      type: object
      required: [items, weigh_in_hint]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'
        weigh_in_hint:
          description: Set when this week's adaptive calorie check produced no suggestion for lack of weigh-ins (F14); otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/WeighInHint'
            - type: 'null'
    WeighInHint:
      type: object
      description: |
        F14: the weekly adaptive calorie check (Mondays, over the previous two complete ISO weeks)
        needs ≥ 4 weigh-ins in each week. When either week has fewer, no `calories` suggestion is
        created and this hint is returned instead, from that Monday until the next check.
      required: [message, evaluated_on, required_per_week, weeks]
      properties:
        message:
          type: string
          description: Safe to show to the user, e.g. "Weigh in at least 4 times a week to get an adaptive calorie suggestion."
        evaluated_on:
          $ref: '#/components/schemas/LocalDate'
        required_per_week:
          type: integer
          const: 4
        weeks:
          type: array
          description: The two evaluated weeks, oldest first.
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [week_start, weigh_ins]
            properties:
              week_start:
                $ref: '#/components/schemas/LocalDate'
              weigh_ins:
                type: integer
                minimum: 0
                maximum: 7
    AcceptSuggestionRequest:
      type: object
      additionalProperties: false
      description: Edit-then-accept. Progression accepts the target fields; calories accepts `kcal`; recalc accepts no overrides.
      properties:
        overrides:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            target_weight_kg:
              type: [number, 'null']
              minimum: 0
              maximum: 500
            reps_min:
              type: integer
              minimum: 1
              maximum: 100
            reps_max:
              type: integer
              minimum: 1
              maximum: 100
            target_seconds:
              type: integer
              minimum: 5
              maximum: 14400
            kcal:
              type: integer
              minimum: 1200
              maximum: 6000

    # ───────── Charts ─────────
    SetStatus:
      type: string
      enum: [met, partial, missed, skipped, extra]
      description: '`met` ✅ actual ≥ target; `partial` ⚠️; `missed` no log; `extra` not planned.'
    SessionChartSet:
      type: object
      required: [set_no, status, completion, target_reps, target_weight_kg, target_seconds, reps, weight_kg, seconds]
      properties:
        set_no:
          type: integer
        status:
          $ref: '#/components/schemas/SetStatus'
        completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        target_reps:
          type: [integer, 'null']
        target_weight_kg:
          type: [number, 'null']
        target_seconds:
          type: [integer, 'null']
        reps:
          type: [integer, 'null']
        weight_kg:
          type: [number, 'null']
        seconds:
          type: [integer, 'null']
    SessionChartExercise:
      type: object
      required: [exercise, is_extra, completion, sets]
      properties:
        exercise:
          $ref: '#/components/schemas/ExerciseSummary'
        is_extra:
          type: boolean
        completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SessionChartSet'
    SessionChart:
      type: object
      required: [session_id, date, training_day_name, status, completion, kcal, exercises]
      properties:
        session_id:
          $ref: '#/components/schemas/Id'
        date:
          $ref: '#/components/schemas/LocalDate'
        training_day_name:
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        kcal:
          oneOf:
            - $ref: '#/components/schemas/Kcal'
            - type: 'null'
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/SessionChartExercise'
    ExerciseChartPoint:
      type: object
      required: [date, session_id, target_weight_kg, target_reps, target_seconds, top_set_weight_kg, top_set_reps, top_set_seconds, volume_kg, is_pr]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        session_id:
          $ref: '#/components/schemas/Id'
        target_weight_kg:
          type: [number, 'null']
          description: Target at the time of the session (snapshot).
        target_reps:
          type: [integer, 'null']
        target_seconds:
          type: [integer, 'null']
        top_set_weight_kg:
          type: [number, 'null']
        top_set_reps:
          type: [integer, 'null']
        top_set_seconds:
          type: [integer, 'null']
        volume_kg:
          type: number
          minimum: 0
          description: Σ reps × weight over the session's sets of this exercise.
        is_pr:
          type: boolean
          description: Personal record (heaviest top set so far, or longest duration for timed).
    ExerciseChart:
      type: object
      required: [exercise, weeks, points]
      properties:
        exercise:
          $ref: '#/components/schemas/ExerciseSummary'
        weeks:
          type: integer
          enum: [4, 12, 26, 52]
        points:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseChartPoint'
    AdherenceDay:
      type: object
      required: [date, training_status, training_completion, nutrition_completion]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        training_status:
          $ref: '#/components/schemas/TrainingStatus'
        training_completion:
          description: '`null` on rest days.'
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        nutrition_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
    AdherenceWeek:
      type: object
      required: [week_start, sessions_planned, sessions_done, training_completion, nutrition_completion]
      properties:
        week_start:
          $ref: '#/components/schemas/LocalDate'
        sessions_planned:
          type: integer
        sessions_done:
          type: integer
        training_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        nutrition_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
    AdherenceChart:
      type: object
      required: [from, to, days, weeks]
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        days:
          type: array
          items:
            $ref: '#/components/schemas/AdherenceDay'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/AdherenceWeek'
    DatedValue:
      type: object
      description: One point of a sparkline. The unit of `value` is set by the series that contains it.
      required: [date, value]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        value:
          type: [number, 'null']
          description: |
            In the unit carried by the series name: `daily_balance_kcal` → kcal,
            `training_completion` → ratio 0–1 (see `Ratio`), `weight_avg_kg` → kg.
            `null` when there is no data for that day.
    WeeklySummary:
      type: object
      required: [week_start, week_end, estimated, sessions_planned, sessions_done, sessions_missed, avg_completion, avg_daily_balance_kcal, target_daily_balance_kcal, weight_avg_start_kg, weight_avg_end_kg, weight_change_kg, sparklines]
      properties:
        week_start:
          $ref: '#/components/schemas/LocalDate'
        week_end:
          $ref: '#/components/schemas/LocalDate'
        estimated:
          type: boolean
          const: true
        sessions_planned:
          type: integer
        sessions_done:
          type: integer
        sessions_missed:
          type: integer
        avg_completion:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        avg_daily_balance_kcal:
          type: [integer, 'null']
        target_daily_balance_kcal:
          type: [integer, 'null']
        weight_avg_start_kg:
          type: [number, 'null']
          description: 7-day average at the start of the week.
        weight_avg_end_kg:
          type: [number, 'null']
        weight_change_kg:
          type: [number, 'null']
        sparklines:
          type: object
          required: [daily_balance_kcal, training_completion, weight_avg_kg]
          properties:
            daily_balance_kcal:
              type: array
              items:
                $ref: '#/components/schemas/DatedValue'
            training_completion:
              type: array
              items:
                $ref: '#/components/schemas/DatedValue'
            weight_avg_kg:
              type: array
              items:
                $ref: '#/components/schemas/DatedValue'
    BodyChartPoint:
      type: object
      required: [date, weight_kg, weight_avg_7d_kg, body_fat_pct]
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        weight_kg:
          type: [number, 'null']
        weight_avg_7d_kg:
          type: [number, 'null']
          description: Mean of existing weigh-ins in the 7 days ending on `date`.
        body_fat_pct:
          type: [number, 'null']
    BodyChart:
      type: object
      required: [weeks, estimated, points]
      properties:
        weeks:
          type: integer
          enum: [4, 12, 26, 52]
        estimated:
          type: boolean
          const: true
          description: Body fat values are estimates.
        points:
          type: array
          items:
            $ref: '#/components/schemas/BodyChartPoint'

    # ───────── Coach ─────────
    CoachProfileInput:
      type: object
      additionalProperties: false
      required: [bio, discoverable]
      properties:
        bio:
          type: string
          maxLength: 500
        discoverable:
          type: boolean
          default: true
    CoachProfile:
      allOf:
        - $ref: '#/components/schemas/CoachProfileInput'
        - type: object
          required: [user_id, display_name]
          properties:
            user_id:
              $ref: '#/components/schemas/Id'
            display_name:
              type: string
    CoachSearchResult:
      type: object
      description: Never contains the coach's email (F16.2).
      required: [id, display_name, bio]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
        bio:
          type: string
    CoachSearchResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CoachSearchResult'
    CoachLinkStatus:
      type: string
      enum: [pending, active, declined, ended]
    CoachLinkRequest:
      type: object
      additionalProperties: false
      required: [coach_id]
      properties:
        coach_id:
          $ref: '#/components/schemas/Id'
    CoachLink:
      type: object
      required: [id, status, source, coach, athlete, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/CoachLinkStatus'
        source:
          type: string
          enum: [request]
          description: '`subscription` will be added with paid coaching (roadmap).'
        coach:
          $ref: '#/components/schemas/UserRef'
        athlete:
          $ref: '#/components/schemas/UserRef'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CoachLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoachLink'
    AttentionReason:
      type: string
      enum: [low_adherence, deload, inactive]
      description: '`low_adherence` < 70 % training adherence over 7 days; `deload` pending/applied in 14 days; `inactive` no logs for 3+ days.'
    CoachAthleteSummary:
      type: object
      required: [athlete, link_id, linked_since, needs_attention, attention_reasons, training_adherence_7d, last_log_date, pending_suggestion_count]
      properties:
        athlete:
          $ref: '#/components/schemas/UserRef'
        link_id:
          $ref: '#/components/schemas/Id'
        linked_since:
          $ref: '#/components/schemas/Timestamp'
        needs_attention:
          type: boolean
        attention_reasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AttentionReason'
        training_adherence_7d:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        last_log_date:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        pending_suggestion_count:
          type: integer
          minimum: 0
    CoachAthleteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoachAthleteSummary'

    # ───────── Notes ─────────
    NoteScope:
      type: string
      enum: [day, session, exercise]
    NoteInput:
      type: object
      additionalProperties: false
      required: [scope, text]
      description: '`day` requires `date`; `session` requires `session_id`; `exercise` requires `exercise_id` (optionally with `session_id` for context).'
      properties:
        scope:
          $ref: '#/components/schemas/NoteScope'
        date:
          $ref: '#/components/schemas/LocalDate'
        session_id:
          $ref: '#/components/schemas/Id'
        exercise_id:
          $ref: '#/components/schemas/Id'
        text:
          type: string
          minLength: 1
          maxLength: 2000
    NoteUpdate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
    Note:
      type: object
      required: [id, athlete_id, author, scope, date, session_id, exercise, text, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        athlete_id:
          $ref: '#/components/schemas/Id'
        author:
          $ref: '#/components/schemas/UserRef'
        scope:
          $ref: '#/components/schemas/NoteScope'
        date:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        exercise:
          oneOf:
            - $ref: '#/components/schemas/ExerciseSummary'
            - type: 'null'
        text:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    NoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'

    # ───────── Notifications ─────────
    NotificationType:
      type: string
      enum:
        - progression_suggestion
        - calorie_suggestion
        - recalc_prompt
        - coach_note
        - link_request_received
        - link_request_approved
        - link_request_declined
        - link_ended
        - plan_edited_by_coach
    Notification:
      type: object
      required: [id, type, payload, created_at, read_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/NotificationType'
        payload:
          $ref: '#/components/schemas/NotificationPayload'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        read_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    NotificationPayload:
      type: object
      description: References for navigation; the client renders the text from `type`. Only the ids relevant to the type are present.
      additionalProperties: false
      properties:
        athlete_id:
          $ref: '#/components/schemas/Id'
        suggestion_id:
          $ref: '#/components/schemas/Id'
        note_id:
          $ref: '#/components/schemas/Id'
        link_id:
          $ref: '#/components/schemas/Id'
        plan_id:
          $ref: '#/components/schemas/Id'
        date:
          $ref: '#/components/schemas/LocalDate'
        actor:
          $ref: '#/components/schemas/UserRef'
    NotificationPage:
      type: object
      required: [items, unread_count, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread_count:
          type: integer
          minimum: 0
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    MarkAllReadResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          minimum: 0

    # ───────── Ops ─────────
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Release the running backend belongs to: the commit SHA of its image (`APP_VERSION`,
            default the image tag), or `dev`/`local` outside a deploy. Deploys and the post-deploy
            smoke test wait until dev serves the expected SHA. Not sensitive.
          example: 1f22fc4a9b3c5d7e8f001122334455667788aabb
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, fail]
            migrations:
              type: string
              enum: [ok, pending]
