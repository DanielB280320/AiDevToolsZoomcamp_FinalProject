openapi: 3.1.0
info:
  title: FitWise API
  version: 1.0.0
  summary: Training and nutrition single source of truth for athletes and their coaches.
  description: |
    Contract for the FitWise MVP backend (see `docs/spec.md`). It is the source of truth for the
    FastAPI implementation and for the generated frontend client. API changes start here.

    ## Conventions

    * **Base path**: every path is relative to `/api/v1`.
    * **JSON**: `snake_case` property names. Unknown properties in requests are rejected (422).
    * **Units** (spec §6.2): the API always uses metric units. Field names carry the unit:
      `_kg`, `_cm`, `_g`, `_m`, `kcal`, `seconds`, `minutes`, `_pct` (percent, 0–100).
      The user's `units` preference (`metric`/`imperial`) is for display and input only; the
      client converts at the edges.
    * **Dates and times** (spec §6.2):
      * `format: date` (`YYYY-MM-DD`) is a *calendar day in the athlete's time zone*
        (e.g. the day a session is planned or a weigh-in belongs to).
      * `format: date-time` is an instant in **UTC**, RFC 3339 with a `Z` suffix
        (e.g. `2026-11-03T07:15:00Z`).
      * "Today" and week boundaries (ISO weeks, Monday start) are computed in the athlete's
        IANA time zone (`User.timezone`).
    * **Estimates**: calorie and body-fat numbers are estimates (spec §6.3); responses that carry
      them include `estimated: true`.
    * **Lists** are returned as objects with an `items` array. Catalog and notification lists are
      cursor-paginated (`limit`, `cursor` → `next_cursor`).
    * **Idempotent logging**: logging endpoints are upserts on their natural key (spec F10.1,
      F12.3). They return `201` when a row is created and `200` when an existing row is replaced.

    ## Authentication

    Sessions use a JWT in an `HttpOnly`, `SameSite=Lax` cookie named `fitwise_session`
    (24 h expiry), set by `POST /auth/signup` and `POST /auth/login`. Every operation requires it
    unless it declares `security: []`. Missing or invalid sessions get `401`.

    ## Authorization model

    Each operation declares its access rule in `x-fitwise-access` (used by the authorization
    matrix tests, spec F16.1):

    | Value | Who may call it |
    |---|---|
    | `public` | Anyone, no session needed. |
    | `authenticated` | Any signed-in user. |
    | `athlete` | Signed-in users with role `athlete` (acting on their own data). Coaches get `403`. |
    | `coach` | Signed-in users with role `coach`. Athletes get `403`. |
    | `owner` | The athlete who owns the resource. A linked coach gets `403` (coaches cannot log or change the athlete's profile; spec F16.4). |
    | `owner-or-coach` | The owning athlete, or a coach with an **active** link to that athlete (read and write). |
    | `author` | The coach who wrote the note, while the link is active. |

    Athlete-scoped paths use `/athletes/{athlete_id}/…`. `athlete_id` is the athlete's user id or
    the literal `me` (the signed-in athlete). A coach calling `me`, or anyone calling an id they are
    not allowed to access — including unknown ids and ids whose coach link has ended — gets `403`
    (never `404`, so ids cannot be enumerated).

    `/sessions/{id}` returns `403` both for an unknown id and for one the caller may not access
    (D41, no existence leak). Other resources addressed by their own id (`/suggestions/{id}`, …)
    return `404` when the id does not exist and `403` when it exists but belongs to an athlete
    the caller may not access.

    ## Errors

    Errors use RFC 9457 problem details (`application/problem+json`, schema `Problem`) with a
    stable machine-readable `code` and, for validation errors, a list of field `errors`.

    | Status | Used for |
    |---|---|
    | 400 | Invalid request line or envelope: unparseable JSON, or an invalid query or path parameter (wrong type or format, unknown enum value, out-of-range `limit`, `from` after `to`, range too long, `week_start` not a Monday). Parameter errors list the offending parameter in `errors`. |
    | 401 | No valid session, or wrong credentials on sign-in. |
    | 403 | Authenticated but not allowed: wrong role, not the owner, no active coach link. |
    | 404 | Resource id does not exist. |
    | 409 | Request conflicts with current state: duplicate email, stale plan `revision`, suggestion already decided, session slot taken, link already exists, edit window closed. |
    | 422 | Well-formed JSON request body that fails validation: schema violations, unknown properties, implausible body values (F2.3), under 18 (F1.1), unaccepted disclaimer (F1.2). Only operations with a request body return 422. |
    | 429 | Rate limit exceeded (5 failed sign-ins per email per 15 min, F1.6). Includes `Retry-After`. |
    | 503 | A dependency is unavailable (database on `/readyz`, Open Food Facts on food import). |

    No 5xx is ever returned because Open Food Facts is down (F6.3): search degrades to
    `available: false`.
  contact:
    name: FitWise team
    url: https://github.com/DanielB280320/AiDevToolsZoomcamp_FinalProject

servers:
  - url: /api/v1
    description: Same origin as the SPA (nginx proxies `/api` to the backend).

security:
  - cookieAuth: []

tags:
  - name: Auth
    description: Sign-up, sign-in and sign-out (F1).
  - name: Me
    description: The signed-in user's account, settings, data export and deletion (F1, F18).
  - name: Profile
    description: Athlete onboarding, profile and calorie/macro targets (F2, F3).
  - name: Body
    description: Weigh-ins, body fat and measurements (F14).
  - name: Catalog
    description: Exercises, foods, meals and Open Food Facts search (F4, F6).
  - name: Plan
    description: The athlete's weekly training and meal plan, custom-mode edits and versions (F5, F7, F8).
  - name: Calendar
    description: Day, week and month views; moving sessions (F9, F13).
  - name: Logging
    description: Set logs, finishing workouts, meal logs and extra activities (F10, F12, F13).
  - name: Suggestions
    description: Progression, adaptive-calorie and recalculation suggestions awaiting a decision (F11, F14).
  - name: Charts
    description: Pre-aggregated chart series (F15).
  - name: Coach
    description: Coach profile, search, linking and the coach dashboard (F16).
  - name: Notes
    description: One-way coach notes on a day, session or exercise (F16).
  - name: Notifications
    description: In-app inbox (F17).
  - name: Ops
    description: Liveness and readiness probes.

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create an account and start a session
      description: |
        Creates an athlete or coach account (role is fixed afterwards) and sets the session cookie.
        Rejects users younger than 18 computed from `birth_date` in `timezone` (F1.1, code
        `underage`), a missing disclaimer acceptance (F1.2, code `disclaimer_required`), passwords
        shorter than 10 characters (F1.4) and duplicate emails compared case-insensitively
        (F1.3, `409 email_taken`). The disclaimer acceptance time is stored as
        `disclaimer_accepted_at`.
      security: []
      x-fitwise-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            examples:
              athlete:
                $ref: '#/components/examples/SignUpAthlete'
      responses:
        '201':
          description: Account created; session cookie set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                athlete:
                  $ref: '#/components/examples/MeAthleteNew'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      operationId: logIn
      summary: Sign in
      description: |
        Verifies the password (argon2id) and sets the session cookie. Wrong email or password returns
        `401 invalid_credentials` without saying which one was wrong. The 6th failed attempt for the
        same email within 15 minutes returns `429` (F1.6).
      security: []
      x-fitwise-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: Signed in; session cookie set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logOut
      summary: Sign out
      description: Clears the session cookie. Idempotent; succeeds without a session.
      security: []
      x-fitwise-access: public
      responses:
        '204':
          description: Signed out; cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ───────────────────────────── Me / Data ─────────────────────────────
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get the signed-in user
      description: Account, settings, onboarding state, coach link and unread notification count.
      x-fitwise-access: authenticated
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                athlete:
                  $ref: '#/components/examples/MeAthleteLinked'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update account settings
      description: Partial update of display name, display units and time zone. Email, role and birth date cannot change.
      x-fitwise-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /me/delete:
    post:
      tags: [Me]
      operationId: deleteMe
      summary: Delete my account and all my data
      description: |
        Requires the current password in the body (F18). `POST` rather than `DELETE`, because
        request bodies on `DELETE` have no defined semantics (spec D48). Permanently deletes every
        row referencing the user, ends all coach links and removes notes the user authored. A coach
        deleting their account ends all links; athletes' data is unaffected. Only the account holder
        can call this, so a coach can never delete an athlete's account (F18.3). Clears the session
        cookie.
      x-fitwise-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Account deleted; cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /me/export:
    get:
      tags: [Me]
      operationId: exportMyData
      summary: Export my data as a ZIP
      description: |
        ZIP with `profile.json`, `plan_versions.json` and CSVs for set logs, meal logs, body metrics,
        extra activities and suggestions (F18). Contains only the caller's own data (F18.1). There is
        no athlete-scoped export, so coaches cannot export an athlete's data (F18.3).
      x-fitwise-access: authenticated
      responses:
        '200':
          description: ZIP archive.
          headers:
            Content-Disposition:
              description: '`attachment; filename="fitwise-export-<YYYY-MM-DD>.zip"`'
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────── Profile & targets ─────────────────────────────
  /athletes/{athlete_id}/onboarding:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    post:
      tags: [Profile]
      operationId: completeOnboarding
      summary: Complete the onboarding wizard
      description: |
        One action that stores the profile, a `BodyMetric` dated today in the athlete's time zone
        (F2.1), computes targets (F3) and generates the training and meal plan (F5, F7) (F2.2).
        Values outside plausible ranges are rejected with 422 (F2.3); the number of
        `preferred_days` must equal `days_per_week` (F2.4). Returns `409 already_onboarded` if the
        athlete already completed onboarding (use the profile and plan endpoints instead).
      x-fitwise-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
            examples:
              ana:
                $ref: '#/components/examples/OnboardingAna'
      responses:
        '201':
          description: Onboarding completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/profile:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Profile]
      operationId: getAthleteProfile
      summary: Get the athlete profile
      description: |
        `404 not_onboarded` if the athlete has not completed onboarding yet (there is no profile).
        An unknown or inaccessible `athlete_id` is `403`, never `404`.
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotOnboarded'
    put:
      tags: [Profile]
      operationId: updateAthleteProfile
      summary: Replace the athlete profile
      description: |
        Replaces the profile (same validation as onboarding). If a target-relevant field changed
        (sex, height, lifestyle, goal, training volume), targets are recomputed with
        `valid_from` = today and future meal-day portions are rescaled; past days never change.
        The training plan is **not** regenerated automatically — call
        `POST /athletes/{athlete_id}/plan/regenerate`. Coaches can view but not edit the profile.
        `404 not_onboarded` if onboarding was not completed (create the profile with
        `POST /athletes/{athlete_id}/onboarding`). An unknown or inaccessible `athlete_id` is `403`,
        never `404`.
      x-fitwise-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteProfileInput'
      responses:
        '200':
          description: Updated profile and current targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotOnboarded'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/targets:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Profile]
      operationId: getTargets
      summary: Get calorie and macro targets
      description: |
        Targets valid on `date` (default: today in the athlete's time zone), with the formulas and
        inputs used in `explanation` (F3.5). `404 not_onboarded` before onboarding.
      x-fitwise-access: owner-or-coach
      parameters:
        - name: date
          in: query
          required: false
          description: Calendar day (athlete's time zone). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Targets'
              examples:
                cutting:
                  $ref: '#/components/examples/TargetsAna'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotOnboarded'

  # ───────────────────────────── Body ─────────────────────────────
  /athletes/{athlete_id}/body-metrics:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Body]
      operationId: listBodyMetrics
      summary: List body metrics
      description: Entries between `from` and `to` (inclusive), oldest first. Both default to the last 90 days.
      x-fitwise-access: owner-or-coach
      parameters:
        - $ref: '#/components/parameters/FromOptional'
        - $ref: '#/components/parameters/ToOptional'
      responses:
        '200':
          description: Body metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Body]
      operationId: logBodyMetric
      summary: Log weight, body fat or measurements for a day
      description: |
        One entry per day: logging again for the same `date` replaces it (`200`), otherwise `201`.
        When neck/waist (and hip for female/unspecified) are given without `body_fat_pct`, body fat
        is estimated with the Navy method (F3.3). `date` cannot be in the future. When the weight
        differs by ≥ 2 % from the weight used for current targets, a pending `recalc` suggestion is
        created and returned (F14). Coaches cannot log weigh-ins (403).
      x-fitwise-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyMetricInput'
      responses:
        '200':
          description: Existing entry for that day replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricResult'
        '201':
          description: Entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyMetricResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ───────────────────────────── Catalog ─────────────────────────────
  /exercises:
    get:
      tags: [Catalog]
      operationId: listExercises
      summary: Search the exercise catalog
      description: |
        Seed exercises plus the caller's own custom exercises plus custom exercises of the caller's
        active-link counterpart (an athlete sees their coach's; a coach sees their athletes').
        Custom exercises are never visible to unrelated users (F4.3). Filterable by name, muscle
        group, equipment and type (F4.2).
      x-fitwise-access: authenticated
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: muscle_group
          in: query
          schema:
            $ref: '#/components/schemas/MuscleGroup'
        - name: equipment
          in: query
          schema:
            $ref: '#/components/schemas/ExerciseEquipment'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ExerciseType'
        - name: region
          in: query
          schema:
            $ref: '#/components/schemas/BodyRegion'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of exercises, ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Catalog]
      operationId: createExercise
      summary: Create a custom exercise
      description: |
        Private to the creator; for coaches also usable in their linked athletes' plans.
        `409` (`exercise_name_taken`) when the name, compared case-insensitively, is already a seed
        exercise or one of the caller's own exercises.
      x-fitwise-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /foods:
    get:
      tags: [Catalog]
      operationId: listFoods
      summary: Search the local food library
      description: Seed, imported (Open Food Facts) and the caller's custom foods; same visibility rule as exercises.
      x-fitwise-access: authenticated
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: diet
          in: query
          description: Only foods compatible with this diet.
          schema:
            $ref: '#/components/schemas/Diet'
        - $ref: '#/components/parameters/ExcludeAllergens'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/FoodSource'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of foods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Catalog]
      operationId: createFood
      summary: Create a custom food
      x-fitwise-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodInput'
      responses:
        '201':
          description: Created (source `custom`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /foods/search:
    get:
      tags: [Catalog]
      operationId: searchOpenFoodFacts
      summary: Search packaged foods on Open Food Facts
      description: |
        Server-side proxy with a 3 s timeout and a 24 h result cache (F6). Behind the feature flag
        `off_search_enabled`. When the flag is off or the upstream times out / fails, the response
        is still `200` with `available: false` and a user-facing `message` (F6.3) — never a 5xx.
      x-fitwise-access: authenticated
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Results, or `available:false` in degraded mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffSearchResult'
              examples:
                results:
                  $ref: '#/components/examples/OffSearchOk'
                unavailable:
                  $ref: '#/components/examples/OffSearchUnavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /foods/import:
    post:
      tags: [Catalog]
      operationId: importOpenFoodFactsFood
      summary: Copy an Open Food Facts product into the local library
      description: |
        Stores the product as a `Food` with source `openfoodfacts` and its product `code`. Unique on
        `code`: importing an already-imported product returns the existing food with `200` (F6.2),
        otherwise `201`. Uses the cached search result when available; if the product is not cached
        and Open Food Facts is unavailable or disabled, returns `503 off_unavailable`.
      x-fitwise-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodImportRequest'
      responses:
        '200':
          description: Already imported; existing food returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
        '201':
          description: Imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /meals:
    get:
      tags: [Catalog]
      operationId: listMeals
      summary: Search the meal library
      description: Seed meals plus visible custom meals. Macros are computed from the foods (F6.1).
      x-fitwise-access: authenticated
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: slot
          in: query
          schema:
            $ref: '#/components/schemas/MealSlot'
        - name: diet
          in: query
          schema:
            $ref: '#/components/schemas/Diet'
        - $ref: '#/components/parameters/ExcludeAllergens'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of meals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Catalog]
      operationId: createMeal
      summary: Create a custom meal from foods and grams
      x-fitwise-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ───────────────────────────── Plan ─────────────────────────────
  /athletes/{athlete_id}/plan:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Plan]
      operationId: getActivePlan
      summary: Get the active weekly plan
      description: Training days and meal days of the active plan version. `404 not_onboarded` if there is no plan yet.
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Active plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete_id}/plan/training:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    put:
      tags: [Plan]
      operationId: updateTrainingPlan
      summary: Replace the training template (custom mode)
      description: |
        Replaces all training days and their planned exercises; array order is the display order.
        Items with an `id` are updated, items without are added, missing ones are removed. Sends the
        plan `revision` read with `GET /plan`; a stale revision returns `409 plan_revision_conflict`
        (e.g. athlete and coach editing at once). Sets the plan `source` to `custom`, records a
        `PlanChange` with author and timestamp (F8.3) and affects only today-and-future sessions;
        past sessions and logs never change (F8.1). Coach edits are labelled with the coach in
        `edited_by` and notify the athlete. At most one training day per weekday.
      x-fitwise-access: owner-or-coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingPlanUpdate'
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/plan/meals:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    put:
      tags: [Plan]
      operationId: updateMealPlan
      summary: Replace the meal template (custom mode)
      description: |
        Replaces the planned meals of each weekday (add/remove/replace meals per slot, change
        portion or grams). Same `revision`, `source`, history and authorization rules as
        `updateTrainingPlan`. Gram overrides in `items` are stored as a private copy of the meal
        owned by the athlete, so the shared library meal is never changed.
      x-fitwise-access: owner-or-coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanUpdate'
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/plan/regenerate:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    post:
      tags: [Plan]
      operationId: regeneratePlan
      summary: Regenerate the suggested plan from the current profile
      description: |
        Creates a new plan version (source `generated`) from the current profile and targets and
        makes it active. Previous versions stay readable (F8.2). `scope` limits regeneration to the
        training or meal part; the other part is copied from the current version.
      x-fitwise-access: owner-or-coach
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegeneratePlanRequest'
      responses:
        '201':
          description: New active plan version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/plan/versions:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Plan]
      operationId: listPlanVersions
      summary: List plan versions
      description: All versions, newest first.
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /athletes/{athlete_id}/plan/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Plan]
      operationId: getPlanVersion
      summary: Get a plan version (read-only)
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Plan version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Calendar ─────────────────────────────
  /athletes/{athlete_id}/days/{date}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - $ref: '#/components/parameters/DayDate'
    get:
      tags: [Calendar]
      operationId: getDay
      summary: Get one day (Today view)
      description: |
        Everything the Today view needs for one calendar day (F9): the session with exercises,
        planned sets and logs; planned meals with their check-off state; extra meal logs and
        activities; the estimated energy balance and macro progress (F13.3); completions; pending
        suggestions; coach notes for the day, its session and its exercises. `date` may be `today`
        (resolved in the athlete's time zone, F9.1). Viewing a planned day materialises its session
        so it has an id for logging (idempotent).
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Day view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete_id}/calendar:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Calendar]
      operationId: getCalendar
      summary: Get Week or Month view summaries
      description: |
        One summary per day from `from` to `to` inclusive (max 42 days, i.e. a 6-week month grid).
        Week view uses Monday–Sunday; month view the weeks covering the month. Past planned
        sessions without logs are `missed`; rest days are never missed (F9.3). A moved session is
        reported on its new date (F9.2). `400 range_too_large` above 42 days, `400 invalid_range`
        when `from` is after `to`.
      x-fitwise-access: owner-or-coach
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Day summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarRange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Calendar]
      operationId: getSession
      summary: Get a session with its sets and logs
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/{session_id}/move:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Calendar]
      operationId: moveSession
      summary: Move a session to another day in the same ISO week
      description: |
        Moves a not-yet-finished session to `date` (F9). The new date must be in the same ISO week
        (Monday start, athlete's time zone), today or later, and must not already hold a session
        (`409 day_occupied`). Moving does not change the plan template. Only the athlete can move
        sessions.
      x-fitwise-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveSessionRequest'
      responses:
        '200':
          description: Moved session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ───────────────────────────── Logging ─────────────────────────────
  /sessions/{session_id}/sets:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Logging]
      operationId: logSet
      summary: Log (or re-log) a set
      description: |
        Upsert keyed by (session, `exercise_id`, `set_no`) — retrying the same request never
        duplicates a set (F10.1): `201` on create, `200` on replace. `as_planned: true` copies the
        targets into the actuals ("done as planned", one tap). Extra sets/exercises use
        `planned_exercise_id: null` or a `set_no` beyond the planned sets. The first log moves the
        session to `in_progress`. The log stores a snapshot of the targets it was performed against.
        After finishing, sets can be edited until `Session.editable_until` (same day + 1 day,
        F10.3); later returns `409 edit_window_closed`. Coaches get `403` (F16.4).
      x-fitwise-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLogInput'
            examples:
              asPlanned:
                $ref: '#/components/examples/SetLogAsPlanned'
              actual:
                $ref: '#/components/examples/SetLogActual'
      responses:
        '200':
          description: Existing set log replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLog'
        '201':
          description: Set log created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /sessions/{session_id}/sets/{set_log_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: set_log_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      tags: [Logging]
      operationId: deleteSetLog
      summary: Remove a logged set
      description: Removes a set log (e.g. an extra set added by mistake). Same edit window as `logSet`.
      x-fitwise-access: owner
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sessions/{session_id}/finish:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Logging]
      operationId: finishSession
      summary: Finish the workout
      description: |
        Closes the session (`done`), records start/end time, computes completion (F10.2) and
        estimated exercise kcal (F13.2), and runs the progression engine (F11), returning the new
        pending suggestions. Calling it again within the edit window recomputes completion and
        replaces this session's pending suggestions (F10.3); after the window `409 edit_window_closed`.
      x-fitwise-access: owner
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishSessionRequest'
      responses:
        '200':
          description: Finished session and generated suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishSessionResult'
              examples:
                finished:
                  $ref: '#/components/examples/FinishSessionDone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/meal-logs:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    post:
      tags: [Logging]
      operationId: logMeal
      summary: Check off, adjust, skip or add a meal
      description: |
        For a planned meal (`planned_meal_id` set): `eaten` (as planned, one tap), `adjusted`
        (with `items` grams) or `skipped`. Upsert keyed by (`date`, `planned_meal_id`), so
        repeating a check-off is idempotent (F12.3): `201` on create, `200` on replace.
        For off-plan food: `extra` with `planned_meal_id: null` and `items` (always creates).
        Returns the log plus the day's updated energy balance and nutrition completion (F12.1, F12.2).
        `date` cannot be in the future. Coaches get `403`.
      x-fitwise-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealLogInput'
            examples:
              eaten:
                $ref: '#/components/examples/MealLogEaten'
              extra:
                $ref: '#/components/examples/MealLogExtra'
      responses:
        '200':
          description: Existing log for this planned meal replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLogResult'
        '201':
          description: Log created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLogResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/meal-logs/{meal_log_id}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - name: meal_log_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      tags: [Logging]
      operationId: deleteMealLog
      summary: Undo a meal check-off or remove extra food
      x-fitwise-access: owner
      responses:
        '200':
          description: Deleted; the day's updated energy balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayEnergyUpdate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete_id}/activities:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    post:
      tags: [Logging]
      operationId: logActivity
      summary: Log an extra (off-plan) activity
      description: |
        Off-plan timed/cardio activity on any day, including rest days (F10, F13.3). Counted in
        burned calories but not in training completion (F10.4). `exercise_id` must be a `timed`
        exercise (422 otherwise). Coaches get `403`.
      x-fitwise-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/activities/{activity_id}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - name: activity_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      tags: [Logging]
      operationId: deleteActivity
      summary: Remove an extra activity
      x-fitwise-access: owner
      responses:
        '200':
          description: Deleted; the day's updated energy balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayEnergyUpdate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Suggestions ─────────────────────────────
  /athletes/{athlete_id}/suggestions:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Suggestions]
      operationId: listSuggestions
      summary: List suggestions
      description: Newest first. Defaults to `status=pending`.
      x-fitwise-access: owner-or-coach
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SuggestionStatus'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/SuggestionKind'
      responses:
        '200':
          description: Suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /suggestions/{suggestion_id}/accept:
    parameters:
      - $ref: '#/components/parameters/SuggestionId'
    post:
      tags: [Suggestions]
      operationId: acceptSuggestion
      summary: Accept (optionally edit-then-accept) a suggestion
      description: |
        Accepted values become the targets for the next sessions of that exercise (progression) or
        the new daily targets from today, rescaling future meal-day portions only (calories, recalc;
        F14.4). Optional `overrides` implement edit-then-accept; overrides must match the suggestion
        kind (422) and calorie overrides are never below the floor (F3.6). Already decided →
        `409 suggestion_already_decided`. The athlete or their linked coach can decide.
      x-fitwise-access: owner-or-coach
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptSuggestionRequest'
      responses:
        '200':
          description: Accepted suggestion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /suggestions/{suggestion_id}/reject:
    parameters:
      - $ref: '#/components/parameters/SuggestionId'
    post:
      tags: [Suggestions]
      operationId: rejectSuggestion
      summary: Reject a suggestion
      description: Changes nothing else (F11.3). Already decided → `409 suggestion_already_decided`.
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Rejected suggestion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ───────────────────────────── Charts ─────────────────────────────
  /athletes/{athlete_id}/charts/session/{session_id}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Charts]
      operationId: getSessionChart
      summary: Session detail — target vs. actual per set
      description: Uses the target snapshots stored with each set log (F15.2). Empty `exercises` when nothing was logged (F15.3).
      x-fitwise-access: owner-or-coach
      responses:
        '200':
          description: Session chart data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionChart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete_id}/charts/exercise/{exercise_id}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - $ref: '#/components/parameters/ExerciseId'
    get:
      tags: [Charts]
      operationId: getExerciseChart
      summary: Exercise over time
      description: |
        One point per finished session containing the exercise: the target at the time of that
        session (snapshot, F15.2), the actual top set, total volume and personal-record markers.
      x-fitwise-access: owner-or-coach
      parameters:
        - $ref: '#/components/parameters/ChartWeeks'
      responses:
        '200':
          description: Exercise series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseChart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /athletes/{athlete_id}/charts/adherence:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Charts]
      operationId: getAdherenceChart
      summary: Daily and weekly training and nutrition completion
      description: Range up to 371 days (heat map + weekly bars). `400 range_too_large` above that.
      x-fitwise-access: owner-or-coach
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Adherence series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdherenceChart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /athletes/{athlete_id}/charts/weekly-summary:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Charts]
      operationId: getWeeklySummary
      summary: Weekly summary tiles and sparklines
      x-fitwise-access: owner-or-coach
      parameters:
        - name: week_start
          in: query
          required: false
          description: Monday of the ISO week (athlete's time zone). Defaults to the current week. Must be a Monday (400).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Weekly summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /athletes/{athlete_id}/charts/body:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Charts]
      operationId: getBodyChart
      summary: Weight, 7-day average and body fat
      description: The 7-day average uses only existing weigh-ins in each window (F14.1).
      x-fitwise-access: owner-or-coach
      parameters:
        - $ref: '#/components/parameters/ChartWeeks'
      responses:
        '200':
          description: Body series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyChart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────────────────────────── Coach ─────────────────────────────
  /coach/profile:
    get:
      tags: [Coach]
      operationId: getCoachProfile
      summary: Get my coach profile
      x-fitwise-access: coach
      responses:
        '200':
          description: Coach profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Coach]
      operationId: updateCoachProfile
      summary: Update my coach profile
      x-fitwise-access: coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachProfileInput'
      responses:
        '200':
          description: Updated coach profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /coaches/search:
    get:
      tags: [Coach]
      operationId: searchCoaches
      summary: Search discoverable coaches
      description: |
        By display name (≥ 3 characters, case-insensitive contains) or exact email. Returns only
        discoverable coaches, never athletes, and never exposes emails (F16.2).
      x-fitwise-access: athlete
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 254
      responses:
        '200':
          description: Matching coaches (max 20).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachSearchResultList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /coach-links:
    get:
      tags: [Coach]
      operationId: listCoachLinks
      summary: List my coach links
      description: For athletes, their links; for coaches, links with their athletes (e.g. `status=pending` for incoming requests).
      x-fitwise-access: authenticated
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CoachLinkStatus'
      responses:
        '200':
          description: Links, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachLinkList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Coach]
      operationId: requestCoachLink
      summary: Send a link request to a coach
      description: |
        Creates a `pending` link and notifies the coach. An athlete with an active coach or a pending
        request gets `409 link_exists` (F16.3). Unknown or non-discoverable coach → `404`.
      x-fitwise-access: athlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachLinkRequest'
      responses:
        '201':
          description: Pending link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /coach-links/{link_id}/approve:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Coach]
      operationId: approveCoachLink
      summary: Approve a pending link request
      description: Only the requested coach. Link must be `pending` (409 otherwise). Notifies the athlete.
      x-fitwise-access: coach
      responses:
        '200':
          description: Active link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /coach-links/{link_id}/decline:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Coach]
      operationId: declineCoachLink
      summary: Decline a pending link request
      description: Only the requested coach. Link must be `pending` (409 otherwise). Notifies the athlete.
      x-fitwise-access: coach
      responses:
        '200':
          description: Declined link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /coach-links/{link_id}/end:
    parameters:
      - $ref: '#/components/parameters/LinkId'
    post:
      tags: [Coach]
      operationId: endCoachLink
      summary: End a link (either side)
      description: |
        Either party; an athlete may also withdraw a `pending` request. Access is revoked
        immediately — subsequent coach calls on that athlete return `403`. Link must be `pending` or
        `active` (409 otherwise). Notifies the other party.
      x-fitwise-access: authenticated
      responses:
        '200':
          description: Ended link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /coach/athletes:
    get:
      tags: [Coach]
      operationId: listCoachAthletes
      summary: Client list sorted by "needs attention"
      description: |
        Actively linked athletes. Athletes needing attention come first (training adherence < 70 %
        over the last 7 days, a deload pending/applied in the last 14 days, or no logs for 3+ days),
        then by display name (F16).
      x-fitwise-access: coach
      responses:
        '200':
          description: Athlete summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachAthleteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────────────────────────── Notes ─────────────────────────────
  /athletes/{athlete_id}/notes:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List coach notes for an athlete
      description: Visible to the athlete and their linked coach. Filter by date range, scope, session or exercise.
      x-fitwise-access: owner-or-coach
      parameters:
        - $ref: '#/components/parameters/FromOptional'
        - $ref: '#/components/parameters/ToOptional'
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/NoteScope'
        - name: session_id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: exercise_id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Notes, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Notes]
      operationId: createNote
      summary: Leave a note (coach)
      description: Only an actively linked coach; athletes get `403` (notes are one-way). Notifies the athlete.
      x-fitwise-access: coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /athletes/{athlete_id}/notes/{note_id}:
    parameters:
      - $ref: '#/components/parameters/AthleteId'
      - $ref: '#/components/parameters/NoteId'
    put:
      tags: [Notes]
      operationId: updateNote
      summary: Edit a note (author)
      x-fitwise-access: author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Notes]
      operationId: deleteNote
      summary: Delete a note (author)
      x-fitwise-access: author
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ───────────────────────────── Notifications ─────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List my notifications
      description: Newest first, with the unread count for the bell icon.
      x-fitwise-access: authenticated
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notification_id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification read
      description: Idempotent (F17.2). Another user's notification → `403`.
      x-fitwise-access: authenticated
      responses:
        '200':
          description: Notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all my notifications read
      x-fitwise-access: authenticated
      responses:
        '200':
          description: Number of notifications marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ───────────────────────────── Ops ─────────────────────────────
  /healthz:
    get:
      tags: [Ops]
      operationId: getHealth
      summary: Liveness probe
      description: The process is up. Does not touch the database.
      security: []
      x-fitwise-access: public
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'

  /readyz:
    get:
      tags: [Ops]
      operationId: getReadiness
      summary: Readiness probe
      description: Ready to serve traffic (database reachable, migrations applied). Used by Compose health checks and deploy smoke tests.
      security: []
      x-fitwise-access: public
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fitwise_session
      description: JWT session cookie (`HttpOnly`, `SameSite=Lax`, 24 h). `Secure` once HTTPS exists (spec §6.4).

  headers:
    SetSessionCookie:
      description: '`fitwise_session=<jwt>; HttpOnly; SameSite=Lax; Path=/; Max-Age=86400`'
      schema:
        type: string
    ClearSessionCookie:
      description: '`fitwise_session=; HttpOnly; SameSite=Lax; Path=/; Max-Age=0`'
      schema:
        type: string
    RetryAfter:
      description: Seconds until the client may retry.
      schema:
        type: integer
        minimum: 1

  parameters:
    AthleteId:
      name: athlete_id
      in: path
      required: true
      description: Athlete user id, or `me` for the signed-in athlete.
      schema:
        $ref: '#/components/schemas/AthleteRef'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SuggestionId:
      name: suggestion_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    LinkId:
      name: link_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NoteId:
      name: note_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ExerciseId:
      name: exercise_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DayDate:
      name: date
      in: path
      required: true
      description: Calendar day `YYYY-MM-DD` in the athlete's time zone, or `today`.
      schema:
        type: string
        pattern: '^(today|\d{4}-\d{2}-\d{2})$'
      example: '2026-11-03'
    From:
      name: from
      in: query
      required: true
      description: First calendar day (inclusive), athlete's time zone.
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      description: Last calendar day (inclusive), athlete's time zone.
      schema:
        type: string
        format: date
    FromOptional:
      name: from
      in: query
      required: false
      description: First calendar day (inclusive), athlete's time zone.
      schema:
        type: string
        format: date
    ToOptional:
      name: to
      in: query
      required: false
      description: Last calendar day (inclusive), athlete's time zone.
      schema:
        type: string
        format: date
    ChartWeeks:
      name: weeks
      in: query
      required: false
      description: Range ending today.
      schema:
        type: integer
        enum: [4, 12, 26, 52]
        default: 12
    SearchQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive name search.
      schema:
        type: string
        maxLength: 100
    ExcludeAllergens:
      name: exclude_allergens
      in: query
      required: false
      description: Exclude items with any of these allergens (comma-separated).
      style: form
      explode: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/Allergen'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string

  responses:
    BadRequest:
      description: Unparseable JSON or an invalid query/path parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/invalid_range
            title: Bad request
            status: 400
            code: invalid_range
            detail: '`from` must not be after `to`.'
    Unauthorized:
      description: Missing or invalid session, or wrong credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not_authenticated
            title: Not authenticated
            status: 401
            code: not_authenticated
            detail: Sign in to continue.
    Forbidden:
      description: Wrong role, not the owner, or no active coach link.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/forbidden
            title: Forbidden
            status: 403
            code: forbidden
            detail: You do not have access to this athlete.
    NotFound:
      description: Resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not_found
            title: Not found
            status: 404
            code: not_found
            detail: Session not found.
    NotOnboarded:
      description: The athlete has not completed onboarding, so there is no profile or targets yet (`code` = `not_onboarded`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not_onboarded
            title: Not onboarded
            status: 404
            code: not_onboarded
            detail: Complete onboarding first.
    Conflict:
      description: Conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/email_taken
            title: Conflict
            status: 409
            code: email_taken
            detail: An account with this email already exists.
    UnprocessableEntity:
      description: The request body failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/validation_error
            title: Validation failed
            status: 422
            code: validation_error
            detail: Some values are outside the allowed range.
            errors:
              - field: body_metric.weight_kg
                code: out_of_range
                message: Weight must be between 35 and 300 kg.
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/rate_limited
            title: Too many requests
            status: 429
            code: rate_limited
            detail: Too many failed sign-in attempts. Try again in 15 minutes.
    ServiceUnavailable:
      description: A dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/off_unavailable
            title: Service unavailable
            status: 503
            code: off_unavailable
            detail: Online food search is unavailable — use the library or create a custom food.

  examples:
    SignUpAthlete:
      summary: Athlete sign-up
      value:
        email: ana@example.com
        password: correct-horse-battery
        display_name: Ana
        role: athlete
        birth_date: '1995-04-12'
        units: metric
        timezone: Europe/Madrid
        accept_disclaimer: true
    MeAthleteNew:
      summary: New athlete, not onboarded
      value:
