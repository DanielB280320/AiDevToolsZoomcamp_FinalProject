[project]
name = "fitwise-oncall"
version = "0.1.0"
description = "FitWise on-call responder: Grafana webhook receiver, dedupe and incident context capture"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "N", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["responder", "tests"]

[tool.ruff.lint.per-file-ignores]
"responder/agent.py" = ["E501"]  # the agent prompt is prose
"tests/**" = ["S101", "S105", "S106", "S603", "S604"]

[tool.mypy]
python_version = "3.12"
files = ["responder", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
